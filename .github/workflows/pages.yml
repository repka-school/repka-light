name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a run in progress is allowed to finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build content and site
        run: npm run build
        env:
          ANALYTICS: "1"
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Check the analytics scripts are in the page
        run: |
          grep -q 'googletagmanager.com/gtm.js?id=GTM-PGV3K8LL' dist/index.html
          grep -q 'static.cloudflareinsights.com/beacon.min.js' dist/index.html
          grep -q 'd29c42e7f1ff408d90a2294f73db3bd1' dist/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
