title: Вычитание
description: Тренируй вычитание в пределах 10, 20 и 100, с переходом через десяток и без него.
cover:
  picture: minus
tags:
  grade: [1, 2]
lessons:
  - slug: within-10
    title: Вычитание в пределах 10
    drill: { operation: subtract, limit: 10 }
  - slug: within-20
    title: Вычитание в пределах 20
    drill: { operation: subtract, limit: 20 }
  - slug: within-100-no-borrow
    title: Вычитание в пределах 100 без перехода через десяток
    drill: { operation: subtract, limit: 100, regroup: false }
  - slug: within-100-borrow
    title: Вычитание в пределах 100 с переходом через десяток
    drill: { operation: subtract, limit: 100, regroup: true }
