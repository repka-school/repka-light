status: active
difficulty: medium
question:
  text: |
    Большой квадрат разделили на 4 одинаковые клетки: 2 ряда по 2 клетки. Он показан на рисунке.
    Сколько всего квадратов можно найти на рисунке? Стороны считай по нарисованным линиям.
  images:
    - file: images/four-squares.png
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: 4 квадрата
    - id: 2
      text: 5 квадратов
      correct: true
    - id: 3
      text: 6 квадратов
    - id: 4
      text: 8 квадратов
    - id: 5
      text: 9 квадратов
points: 2
classification:
- subject: math
  concept: counting
- subject: math
  concept: grid-geometry
learning:
  hint:
    text: >-
      Квадраты бывают разного размера. Посчитай отдельно самые маленькие, а потом поищи квадраты побольше, сложенные из нескольких клеток.
explanation:
  text: |
    В каждом ряду по 2 маленьких квадрата. Всего их 2 + 2 = 4.
    Есть ещё один большой квадрат из всех четырёх клеток. Получается 4 + 1 = 5 квадратов.
    Других размеров здесь нет: сторона квадрата занимает одну клетку или две.
