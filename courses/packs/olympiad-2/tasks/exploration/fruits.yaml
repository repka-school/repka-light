question:
  text: |
    Аня, Боря и Вера съели по одному фрукту. Всего было одно яблоко, один банан и одна груша.
    Аня не ела ни банан, ни грушу. Боря не ел грушу.
    Кто какой фрукт съел?
answer:
  kind: single
  hide: true
  options:
    - id: 1
      text: Аня — яблоко, Боря — банан, Вера — грушу
      correct: true
