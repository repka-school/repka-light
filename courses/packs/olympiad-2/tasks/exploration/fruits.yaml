learning:
  hint:
    text: >-
      Начни с того, про кого известно больше всего: вычеркни ему запрещённые фрукты и посмотри, что остаётся. Потом убери этот фрукт у остальных.
explanation:
  text: |
    Аня не ела ни банан, ни грушу. Значит, она съела яблоко.
    Остались банан и груша. Боря не ел грушу, поэтому ему достался банан. Вера съела грушу.
    Проверь: у каждого по одному фрукту, и все подсказки подходят.
