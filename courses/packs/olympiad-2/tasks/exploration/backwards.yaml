status: active
difficulty: medium
question:
  text: |
    Маша задумала число. Она прибавила к нему 5, потом отняла 2 и получила 10.
    Какое число задумала Маша?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "3"
    - id: 2
      text: "5"
    - id: 3
      text: "8"
    - id: 4
      text: "13"
    - id: 5
      text: "7"
      correct: true
points: 2
classification:
- subject: math
  concept: backward-reasoning
learning:
  hint:
    text: >-
      Начни с конца: с числа, которое получилось у Маши, и делай всё наоборот. Где она прибавляла, ты отнимай, а где отнимала — прибавляй.
explanation:
  text: |
    Начни с результата — 10. Верни 2, которые Маша отняла: 10 + 2 = 12.
    Теперь убери 5, которые она прибавила: 12 − 5 = 7.
    Проверь: 7 + 5 = 12, а 12 − 2 = 10. Значит, Маша задумала число 7.
