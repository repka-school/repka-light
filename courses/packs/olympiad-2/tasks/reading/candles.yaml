status: active
difficulty: easy
question:
  text: |
    Горели 5 свечей. Две свечи погасили. Остальные к утру сгорели полностью. Погасшие свечи больше не зажигали.
    Сколько свечей осталось к утру?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: 0 свечей
    - id: 2
      text: 1 свеча
    - id: 3
      text: 3 свечи
    - id: 4
      text: 2 свечи
      correct: true
    - id: 5
      text: 5 свечей
points: 1
classification:
- subject: math
  concept: careful-reading
learning:
  hint:
    text: >-
      Свеча, которая сгорела полностью, исчезает. Раздели свечи на две группы: какие горели до утра, а какие нет.
explanation:
  text: |
    Три свечи продолжали гореть и сгорели полностью. Две погасшие свечи больше не горели.
    Поэтому к утру остались 2 свечи — те, которые погасили.
