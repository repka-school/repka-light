status: active
difficulty: easy
question:
  text: |
    В одном пакете 1 килограмм ваты. В другом — 1 килограмм гвоздей.
    Сравни вес ваты и гвоздей без пакетов. Что верно?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: Вата тяжелее
    - id: 2
      text: Гвозди тяжелее
    - id: 3
      text: Более полный пакет всегда тяжелее
    - id: 4
      text: Без размеров пакетов не узнать
    - id: 5
      text: Вата и гвозди весят одинаково
      correct: true
points: 1
classification:
- subject: math
  concept: careful-reading
learning:
  hint:
    text: >-
      Не путай, сколько места занимает вещество и сколько оно весит. Найди в условии, что сказано именно о весе.
explanation:
  text: |
    Ваты — 1 килограмм, и гвоздей — 1 килограмм. Значит, они весят одинаково.
    Вата может занимать больше места. Но в вопросе нужно сравнить вес, а не размер.
