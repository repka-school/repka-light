kind: theory
status: active
learning:
  title: Отмерь без делений
  subject: math
blocks:
- kind: says
  text: У сосудов нет делений на стенках. Как же отмерить нужное количество воды? Переливать!
- kind: tiles
  title: Что можно делать
  items:
  - picture: jug-full
    title: Наполнить до края
  - picture: jug-empty
    title: Вылить всю воду
  - picture: jug-pour
    title: Перелить в другой
    text: Пока первый не опустеет или второй не заполнится.
- kind: facts
  items:
  - picture: list
    title: Записывай два числа
    text: Сначала сколько воды в маленьком сосуде, потом сколько в большом.
  - picture: check
    title: После каждого действия
    text: Запиши оба числа снова. Так ты не потеряешь нужное количество воды.
- kind: try
  text: Сосуд на 5 литров полон, сосуд на 2 литра пуст. Из большого наполнили маленький до края. Сколько литров осталось в большом?
  answer: '3 литра: 5 − 2 = 3.'
