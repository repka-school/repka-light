status: active
difficulty: hard
question:
  text: |
    Сосуды на 3 и 5 литров пусты. За один шаг можно наполнить один сосуд, опустошить один сосуд или перелить до края либо до опустошения. Какое наименьшее число шагов нужно, чтобы в большом сосуде оказалось 4 литра?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "4"
    - id: 2
      text: "5"
    - id: 3
      text: "7"
    - id: 4
      text: "8"
    - id: 5
      text: "6"
      correct: true
points: 3
classification:
- subject: math
  concept: processes-algorithms
- subject: math
  concept: counting
learning:
  hint:
    text: >-
      Записывай состояние парой чисел (маленький, большой). Выпиши все пары, которые получаются за 1 шаг, потом за 2 шага и так далее, не повторяя уже встреченных, и найди шаг, на котором впервые появится нужная пара.
explanation:
  text: |
    Записывай сначала маленький сосуд: (0, 0) → (0, 5) → (3, 2) → (0, 2) → (2, 0) → (2, 5) → (3, 4). Это 6 шагов.
    Проверим, можно ли быстрее. Начни с (0, 0) и выписывай все новые состояния после каждого шага. Уже встречавшиеся пары повторять не нужно.
    1 шаг: (0, 5), (3, 0).
    2 шага: (0, 3), (3, 2), (3, 5).
    3 шага: (0, 2), (3, 3).
    4 шага: (1, 5), (2, 0).
    5 шагов: (1, 0), (2, 5).
    6 шагов: (0, 1), (3, 4).
    Впервые 4 литра в большом сосуде появляются на шестом шаге. Значит, путь из шести шагов самый короткий.
