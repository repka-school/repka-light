status: active
difficulty: easy
question:
  text: |
    В комнате 4 угла. В каждом углу сидит одна кошка. Каждая кошка видит трёх кошек в других углах.
    Сколько всего кошек в комнате?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: 4 кошки
      correct: true
    - id: 2
      text: 3 кошки
    - id: 3
      text: 7 кошек
    - id: 4
      text: 12 кошек
    - id: 5
      text: 16 кошек
points: 1
classification:
- subject: math
  concept: careful-reading
learning:
  hint:
    text: >-
      Нарисуй комнату и посади в каждый угол по кошке. Те кошки, которых видит одна из них, новые или уже нарисованные?
explanation:
  text: |
    Нарисуй по одной кошке в каждом из 4 углов. Получится 4 кошки.
    Выбери одну из них: в других углах сидят ещё 3. Это те же кошки, которые уже есть на рисунке. Новых кошек добавлять не нужно.
