status: active
difficulty: medium
question:
  text: |
    В автобусе ехало 10 человек. По дороге автобус остановился: вышли 3 человека и вошли 5. Потом он остановился ещё раз: вышли 4 человека. Больше остановок не было.
    Сколько остановок сделал автобус по дороге?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: 1 остановку
    - id: 2
      text: 8 остановок
    - id: 3
      text: 2 остановки
      correct: true
    - id: 4
      text: 3 остановки
    - id: 5
      text: 4 остановки
points: 2
classification:
- subject: math
  concept: careful-reading
learning:
  hint:
    text: >-
      Перечитай вопрос: что именно нужно сосчитать? Найди в условии каждое место, где автобус останавливался.
explanation:
  text: |
    Автобус остановился первый раз, потом ещё один раз. Всего 1 + 1 = 2 остановки.
    Считать пассажиров не нужно: вопрос об остановках.
