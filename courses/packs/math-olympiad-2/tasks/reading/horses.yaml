status: active
difficulty: medium
question:
  text: |
    Три лошади бежали рядом от старта до финиша. Вместе они преодолели путь длиной 12 километров.
    Сколько километров пробежала каждая лошадь?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: 4 километра
    - id: 2
      text: 12 километров
      correct: true
    - id: 3
      text: 3 километра
    - id: 4
      text: 24 километра
    - id: 5
      text: 36 километров
points: 2
classification:
- subject: math
  concept: careful-reading
learning:
  hint:
    text: >-
      Подумай, бежали лошади по очереди или вместе по одной и той же дороге. Какой путь прошла каждая из них?
explanation:
  text: |
    Каждая лошадь бежала весь путь от старта до финиша. Длина этого пути — 12 километров.
    Значит, каждая пробежала 12 километров. Лошади бежали рядом, а не по очереди.
