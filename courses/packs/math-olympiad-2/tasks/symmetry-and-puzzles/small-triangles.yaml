learning:
  hint:
    text: >-
      Найди на рисунке детали 3 и 5: одинаковые ли они и где у них прямой угол? Представь, что прикладываешь их друг к другу длинными сторонами, и посчитай стороны и углы.
explanation:
  text: |
    Оба маленьких треугольника одинаковые, с прямым углом. Поверни один и соедини длинные стороны. Снаружи получатся четыре равные стороны и четыре прямых угла — квадрат.
