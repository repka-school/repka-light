status: active
difficulty: easy
question:
  text: |
    Сколько треугольных деталей в танграме на рисунке?
  images:
    - file: images/tangram-seven.png
      alt: >-
        Квадрат танграма разделён на детали. Вверху большой треугольник 1, слева такой же треугольник 2.
        Внизу слева маленький треугольник 3, правее квадрат 4. Ближе к правому краю треугольник 5, такой
        же, как 3. У обоих маленьких треугольников две равные стороны образуют прямой угол. Справа
        параллелограмм 6, в нижнем правом углу треугольник 7.
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "3"
    - id: 2
      text: "4"
    - id: 3
      text: "5"
      correct: true
    - id: 4
      text: "6"
    - id: 5
      text: "7"
points: 1
classification:
- subject: math
  concept: grid-geometry
- subject: math
  concept: angles-triangles
learning:
  hint:
    text: >-
      Пройди по номерам деталей от 1 до 7 и у каждой посчитай углы: у треугольника их три.
explanation:
  text: |
    Треугольники имеют номера 1, 2, 3, 5 и 7 — всего 5. Деталь 4 — квадрат, а у детали 6 четыре стороны.
