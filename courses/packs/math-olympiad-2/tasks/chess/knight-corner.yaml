question:
  text: |
    На пустой доске 8 на 8 конь стоит на a1. На сколько клеток он может пойти за один ход буквой «Г»?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "0"
    - id: 2
      text: "1"
    - id: 3
      text: "3"
    - id: 4
      text: "2"
      correct: true
    - id: 5
      text: "4"
points: 2
classification:
- subject: math
  concept: counting
learning:
  hint:
    text: >-
      Перечисли все направления хода буквой «Г» из a1 и вычеркни те, что уводят за край доски.
explanation:
  text: |
    Внутри доски подходят только b3 и c2. Остальные направления ведут за край. Значит, доступны 2 клетки.
