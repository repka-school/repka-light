kind: theory
status: active
learning:
  title: Как ходят фигуры
  subject: math
blocks:
- kind: says
  text: На шахматной доске 8 столбцов с буквами от a до h слева направо и 8 рядов с числами от 1 до 8 снизу вверх. Соседние клетки разного цвета.
- kind: facts
  items:
  - picture: rook
    title: Ладья
    text: Ходит по ряду или по столбцу.
  - picture: bishop
    title: Слон
    text: Ходит по диагонали.
  - picture: knight
    title: Конь
    text: 'Ходит буквой «Г»: две клетки в одном направлении и одну поперёк.'
- kind: tip
  picture: magnifier
  text: В задачах доска пустая, кроме названной фигуры. Клетку, на которой фигура стоит, не считай.
- kind: try
  text: Слон стоит на белой клетке. Может ли он когда-нибудь попасть на чёрную?
  answer: Нет. По диагонали все клетки одного цвета.
