status: active
difficulty: hard
question:
  text: |
    У доски 4 на 4 клетки шахматная раскраска. Из неё убрали две чёрные клетки. Можно ли закрыть остаток костяшками, каждая из которых занимает две соседние по стороне клетки?
answer:
  kind: single
  hide: true
  options:
    - id: 1
      text: 'Нельзя: белых клеток осталось больше, чем чёрных'
      correct: true
    - id: 2
      text: 'Можно: осталось чётное число клеток'
    - id: 3
      text: 'Можно: каждая костяшка закроет две белые клетки'
    - id: 4
      text: 'Нельзя: осталось нечётное число клеток'
    - id: 5
      text: 'Можно: нужно только повернуть костяшки'
points: 3
classification:
- subject: math
  concept: invariants-coloring
- subject: math
  concept: grid-geometry
learning:
  hint:
    text: >-
      Посмотри, какого цвета две клетки, которые закрывает любая костяшка. Потом сравни, сколько белых и сколько чёрных клеток осталось на доске.
explanation:
  text: |
    Сначала было 8 белых и 8 чёрных клеток. Осталось 8 белых и 6 чёрных. Каждая костяшка покрывает одну белую и одну чёрную клетку. Поровну закрыть 8 и 6 клеток невозможно.
