learning:
  title: Все растут вместе
  subject: math
blocks:
- kind: says
  text: Через год тебе станет на год больше. И всем остальным тоже!
- kind: facts
  items:
  - picture: cake
    title: Разница не меняется
    text: Все взрослеют одинаково, поэтому разница возрастов остаётся прежней.
  - picture: people
    title: Два описания сразу
    text: Один человек может быть мамой для своего ребёнка и дочерью для своей мамы.
- kind: tip
  picture: pencil
  text: Нарисуй людей, прежде чем считать.
- kind: try
  text: Коту 3 года, щенку 1 год. На сколько лет кот будет старше щенка через 5 лет?
  answer: На 2 года, как и сейчас. Оба станут старше на 5 лет.
