- subject: math
  concept: coordinates-vectors
learning:
  hint:
    text: >-
      Делай шаги по одному: шаг вправо меняет букву столбца, шаг вверх меняет номер ряда.
explanation:
  text: |
    Два шага вправо: Б2 → В2 → Г2. Один вверх: Г2 → Г3. Конечная клетка — Г3.
