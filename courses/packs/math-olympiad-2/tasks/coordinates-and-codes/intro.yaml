kind: theory
status: active
learning:
  title: Адрес клетки и тайный шифр
  subject: math
blocks:
- kind: says
  text: У каждой клетки есть адрес, как у дома. А буквы умеют прятаться за шифром!
- kind: facts
  items:
  - picture: coords
    title: Адрес клетки
    text: Сначала столбец, потом ряд. Столбцы А, Б, В, Г идут слева направо, ряды 1, 2, 3, 4 — снизу вверх.
  - picture: key
    title: Шифр
    text: Каждый знак заменяют по одному правилу. Сначала запиши ключ.
  - picture: arrow
    title: Знак за знаком
    text: Расшифровывай по порядку. Не меняй правило посередине сообщения.
- kind: try
  text: 'Ключ шифра: 1 — О, 2 — К, 3 — Т. Какое слово зашифровано числами 2, 1, 3?'
  answer: КОТ.
