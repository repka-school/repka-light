status: active
difficulty: medium
question:
  text: |
    В маленьком алфавите буквы идут по кругу: А, Б, В, Г, Д, Е, а после Е снова идёт А, и так далее. При шифровании каждую букву меняют на следующую. Во что превратится запись БАД?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: ВБЕ
      correct: true
    - id: 2
      text: АЕГ
    - id: 3
      text: ВАГ
    - id: 4
      text: БВЕ
    - id: 5
      text: ЕБВ
points: 2
classification:
- subject: math
  concept: ciphers-codes
learning:
  hint:
    text: >-
      Меняй каждую букву отдельно на следующую в круге и не переставляй буквы. Помни, что после последней буквы снова идёт первая.
explanation:
  text: |
    Б меняется на В, А — на Б, Д — на Е. Сохрани порядок букв: ВБЕ. Для расшифровки нужно было бы идти назад, но здесь мы шифруем.
