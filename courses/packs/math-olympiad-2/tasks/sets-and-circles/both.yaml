status: active
difficulty: easy
question:
  text: |
    На столе лежат красный мяч, синий мяч, красный кубик, зелёный кубик и жёлтая машинка. Какой предмет одновременно красный и является мячом?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: Красный мяч
      correct: true
    - id: 2
      text: Синий мяч
    - id: 3
      text: Красный кубик
    - id: 4
      text: Зелёный кубик
    - id: 5
      text: Жёлтая машинка
points: 1
classification:
- subject: math
  concept: sets-euler-circles
learning:
  hint:
    text: >-
      Проверь каждый предмет по двум признакам по очереди: красный ли он и мяч ли он. Нужен предмет, у которого есть оба признака.
explanation:
  text: |
    Нужны сразу два признака: красный цвет и форма мяча. Красный кубик подходит только по цвету, синий мяч — только по виду игрушки. Оба признака есть у красного мяча.
