status: active
difficulty: easy
question:
  text: |
    На рисунке левый круг — дети, которые рисуют, правый — дети, которые поют. Числа обозначают области. В какой области находятся дети, которые рисуют, но не поют?
  images:
    - file: images/sets-regions.png
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: Только в области 2
    - id: 2
      text: Только в области 1
      correct: true
    - id: 3
      text: Только в области 3
    - id: 4
      text: В областях 1 и 2
    - id: 5
      text: Только в области 4
points: 1
classification:
- subject: math
  concept: sets-euler-circles
learning:
  hint:
    text: >-
      Внутри левого круга те, кто рисует, внутри правого те, кто поёт. Найди область, которая внутри одного круга, но снаружи другого.
explanation:
  text: |
    В области 1 ты находишься внутри левого круга и снаружи правого. Здесь дети, которые рисуют, но не поют. В области 2 дети делают и то и другое.
