difficulty: hard
question:
  text: |
    У Маши, Коли и Пети по одному разному питомцу: кот, пёс или хомяк. У Маши не кот и не пёс. У Коли тоже не кот и не пёс. Какой вывод верен?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: Маша — хомяк, Коля — кот, Петя — пёс
    - id: 2
      text: Маша — кот, Коля — хомяк, Петя — пёс
    - id: 3
      text: Маша — хомяк, Коля — пёс, Петя — кот
    - id: 4
      text: Маша — пёс, Коля — кот, Петя — хомяк
    - id: 5
      text: Все условия сразу выполнить нельзя
      correct: true
points: 3
classification:
- subject: math
  concept: logic-tables
learning:
  hint:
    text: >-
      Начерти таблицу: дети в строках, питомцы в столбцах. Поставь минусы по подсказкам и посмотри, что остаётся каждому. Помни, что питомцы у всех разные.
explanation:
  text: |
    По первым подсказкам у Маши должен быть хомяк. По следующим у Коли тоже должен быть хомяк. Но по условию питомцы разные. Значит, подходящей расстановки нет.
