kind: theory
status: active
learning:
  title: Таблица всё расставит
  subject: math
blocks:
- kind: says
  text: У каждого героя свой предмет. Кто что взял? В уме легко запутаться, а таблица поможет.
- kind: steps
  items:
  - picture: table
    title: Нарисуй таблицу
    text: Слева имена, сверху предметы.
  - picture: minus
    title: Ставь минус
    text: Там, где предмет не подходит.
  - picture: plus
    title: Ставь плюс
    text: Там, где пара найдена.
  - picture: check
    title: Проверь
    text: В каждой строке и в каждом столбце одна пара. Подходят ли все подсказки?
- kind: try
  text: 'У Нины и Пети по одной игрушке: мяч и кубик. Нина взяла мяч. Что досталось Пете?'
  answer: Кубик. Мяч уже у Нины, значит, Пете остался кубик.
