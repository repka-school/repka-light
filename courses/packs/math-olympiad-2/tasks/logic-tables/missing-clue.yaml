- subject: math
  concept: logic-tables
learning:
  hint:
    text: >-
      Отметь в таблице то, что известно, и посмотри, что остаётся двум другим детям. Подходит ли каждому ровно один вариант или больше?
explanation:
  text: |
    Боре и Вите остались космос и сказки. Боря мог взять любую из этих двух книг. Обе расстановки подходят, поэтому нужна ещё одна подсказка.
