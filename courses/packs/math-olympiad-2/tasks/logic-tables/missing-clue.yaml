question:
  text: |
    Ася, Боря и Витя взяли по одной разной книге: о зверях, о космосе и сказки. Известно только, что Ася взяла книгу о зверях. Что можно сказать наверняка?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: Боря взял книгу о космосе
    - id: 2
      text: Боря взял сказки
    - id: 3
      text: Витя взял книгу о космосе
    - id: 4
      text: Пока нельзя узнать, какую книгу взял Боря
      correct: true
    - id: 5
      text: Витя взял сказки
points: 2
