status: active
difficulty: easy
question:
  text: |
    Ты решаешь задачу по таблице. В строке «Соня» и столбце «Кот» стоит знак «−». Что он означает?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: У Сони нет кота
      correct: true
    - id: 2
      text: У Сони есть кот
    - id: 3
      text: У кота нет имени
    - id: 4
      text: У Сони нет ни одного питомца
    - id: 5
      text: У всех детей есть коты
points: 1
classification:
- subject: math
  concept: logic-tables
learning:
  hint:
    text: >-
      Минус стоит на пересечении одной строки и одного столбца. Подумай, о какой паре он говорит и говорит ли он что-нибудь о других клетках таблицы.
explanation:
  text: |
    Знак находится на пересечении имени Сони и слова «Кот». Он запрещает только эту пару: Соня не хозяйка кота. Про других питомцев этот знак ничего не говорит.
