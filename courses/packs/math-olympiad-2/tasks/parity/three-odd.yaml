status: active
difficulty: hard
question:
  text: |
    Можно ли выбрать три нечётных числа так, чтобы их сумма была 10?
answer:
  kind: single
  hide: true
  options:
    - id: 1
      text: 'Да: 1, 3 и 6'
    - id: 2
      text: 'Да: 1, 5 и 5'
    - id: 3
      text: 'Да: 3, 3 и 4'
    - id: 4
      text: 'Нет: три числа всегда дают больше 10'
    - id: 5
      text: 'Нет: сумма трёх нечётных чисел нечётная'
      correct: true
points: 3
classification:
- subject: math
  concept: parity
learning:
  hint:
    text: >-
      Разложи каждое нечётное число на пары: у каждого останется один предмет. Подумай, сколько одиночек наберётся у трёх чисел и смогут ли они все собраться в пары.
explanation:
  text: |
    У каждого нечётного числа остаётся один предмет без пары. Из трёх одиночных предметов два составят пару, а один останется. Значит, сумма будет нечётной. Число 10 чётное, поэтому такой выбор невозможен.
