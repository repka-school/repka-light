status: active
difficulty: medium
question:
  text: |
    У Лены 11 фишек. Какое самое маленькое число фишек нужно убрать, чтобы осталось чётное число?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "0"
    - id: 2
      text: "2"
    - id: 3
      text: "3"
    - id: 4
      text: "1"
      correct: true
    - id: 5
      text: "4"
points: 2
classification:
- subject: math
  concept: parity
learning:
  hint:
    text: >-
      Чётное число раскладывается парами без остатка. Разложи фишки парами, посмотри, остаётся ли одиночка, и подумай, как от неё избавиться, убрав как можно меньше.
explanation:
  text: |
    Одиннадцать — нечётное число. Убери одну фишку: останется 10, то есть 5 полных пар. Убрать меньше одной — значит не убирать ничего, но тогда останется 11.
