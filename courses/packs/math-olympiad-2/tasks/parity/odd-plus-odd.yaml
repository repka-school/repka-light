status: active
difficulty: medium
question:
  text: |
    В одной кучке 5 камешков, в другой 7. Их объединили. Что получится?
answer:
  kind: single
  hide: true
  options:
    - id: 1
      text: 'Нечётное число: обе кучки были нечётными'
    - id: 2
      text: 'Чётное число: получится 11'
    - id: 3
      text: 'Чётное число: два одиночных камешка образуют пару'
      correct: true
    - id: 4
      text: 'Нечётное число: получится 13'
    - id: 5
      text: Это зависит от цвета камешков
points: 2
classification:
- subject: math
  concept: parity
learning:
  hint:
    text: >-
      Разложи каждую кучку на пары и посмотри, что остаётся без пары в каждой. Что будет с этими одиночками, когда кучки объединят?
explanation:
  text: |
    В каждой кучке после составления пар остаётся один камешек. Эти два камешка тоже образуют пару. Проверь сложением: 5 + 7 = 12, а 12 — чётное число.
