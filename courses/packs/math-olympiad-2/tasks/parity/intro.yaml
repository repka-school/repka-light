kind: theory
status: active
learning:
  title: Всем ли хватит пары?
  subject: math
blocks:
- kind: says
  text: Собери предметы в пары. Всем хватило? Или кто-то остался один?
- kind: facts
  items:
  - picture: pairs
    title: Чётное число
    text: Все предметы собрались в пары.
  - picture: odd
    title: Нечётное число
    text: Один предмет остался без пары.
  - picture: zero
    title: Ноль тоже чётный
    text: Без пары ничего не осталось.
- kind: tip
  picture: bulb
  text: Вместо долгого счёта смотри на пары. Две группы полных пар вместе снова дают полные пары.
- kind: try
  text: На батарее сохнут 7 варежек. Все ли они соберутся в пары?
  answer: Нет. Получится 3 пары, а одна варежка останется. 7 — нечётное число.
