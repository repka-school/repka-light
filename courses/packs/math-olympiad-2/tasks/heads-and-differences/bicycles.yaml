status: active
difficulty: hard
question:
  text: |
    На площадке 7 велосипедов: двухколёсные и трёхколёсные. Всего у них 17 колёс. Сколько трёхколёсных велосипедов?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "1"
    - id: 2
      text: "2"
    - id: 3
      text: "4"
    - id: 4
      text: "5"
    - id: 5
      text: "3"
      correct: true
points: 3
classification:
- subject: math
  concept: sum-difference
learning:
  hint:
    text: >-
      Представь, что все велосипеды двухколёсные. Посчитай, сколько тогда было бы колёс и сколько не хватает. Что меняется, если один двухколёсный заменить трёхколёсным?
explanation:
  text: |
    Если у всех 7 велосипедов по 2 колеса, получится 14 колёс. Не хватает 17 − 14 = 3. Каждый трёхколёсный добавляет одно колесо. Значит, таких велосипедов 3. Проверка: 4 двухколёсных дают 8 колёс, 3 трёхколёсных — 9; вместе 17.
