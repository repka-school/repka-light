status: active
difficulty: medium
question:
  text: |
    Две ленты вместе имеют длину 12 сантиметров. Одна длиннее другой на 4 сантиметра. Сколько сантиметров в короткой ленте?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "2"
    - id: 2
      text: "3"
    - id: 3
      text: "4"
      correct: true
    - id: 4
      text: "5"
    - id: 5
      text: "6"
points: 2
classification:
- subject: math
  concept: sum-difference
learning:
  hint:
    text: >-
      Мысленно отрежь от длинной ленты лишний кусок, на который она длиннее. Тогда ленты станут равными: раздели оставшуюся длину пополам.
explanation:
  text: |
    Мысленно убери лишние 4 сантиметра длинной ленты. Останутся две равные части общей длиной 12 − 4 = 8 сантиметров. Каждая по 4. Проверь: короткая 4, длинная 8, вместе 12.
