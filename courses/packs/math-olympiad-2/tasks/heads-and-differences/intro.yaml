kind: theory
status: active
learning:
  title: А если все — куры?
  subject: math
blocks:
- kind: says
  text: Во дворе куры и кролики. Известно, сколько у них голов и ног. Как узнать, кого сколько?
- kind: steps
  items:
  - picture: chicken
    title: Пусть все — куры
    text: У каждой по 2 ноги. Сколько ног получилось?
  - picture: rabbit
    title: Меняй курицу на кролика
    text: Каждая замена добавляет 2 ноги.
  - picture: check
    title: Проверь
    text: Сошлись и головы, и ноги?
- kind: facts
  title: Когда известно, сколько вместе и на сколько больше
  items:
  - picture: minus
    title: Убери лишнее
    text: Из большей кучки — столько, на сколько она больше.
  - picture: pairs
    title: Раздели поровну
    text: То, что осталось, делится на две равные части.
- kind: try
  text: У кур и кроликов вместе 3 головы и 8 ног. Сколько кроликов?
  answer: 1 кролик. У трёх кур 6 ног. Не хватает 2 ног, значит, вместо одной курицы — кролик.
