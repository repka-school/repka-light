learning:
  hint:
    text: >-
      Представь, что грань 2 лежит на столе, а соседние с ней квадраты поднимаются стенками. Какая грань закроет куб сверху?
explanation:
  text: |
    Оставь грань 2 основанием. Грани 1 и 3 поднимутся по бокам, 5 и 6 — с двух других сторон. Грань 4 закроет куб сверху и окажется напротив 2.
