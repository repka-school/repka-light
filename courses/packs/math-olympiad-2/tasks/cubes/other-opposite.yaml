question:
  text: |
    Какая грань этой же развёртки после складывания куба окажется напротив грани 5?
  images:
    - file: images/cube-net.png
      alt: >-
        В ряд слева направо стоят квадраты 1, 2, 3, 4. Квадрат 5 примыкает к квадрату 2 сверху, квадрат
        6 — снизу.
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "1"
    - id: 2
      text: "2"
    - id: 3
      text: "6"
      correct: true
    - id: 4
      text: "3"
    - id: 5
      text: "4"
