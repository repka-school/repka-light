learning:
  hint:
    text: >-
      Грани, прикреплённые на развёртке к противоположным сторонам одного квадрата, при складывании поднимаются навстречу друг другу.
explanation:
  text: |
    Грани 5 и 6 прикреплены к противоположным сторонам грани 2. При складывании они поднимутся навстречу друг другу и будут противоположными стенками куба.
