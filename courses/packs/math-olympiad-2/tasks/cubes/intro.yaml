kind: theory
status: active
learning:
  title: Собери кубик в уме
  subject: math
blocks:
- kind: says
  text: У куба шесть квадратных граней. Его можно развернуть на бумаге, как коробку.
- kind: facts
  items:
  - picture: net
    title: Развёртка
    text: Рисунок граней на бумаге. Его можно сложить в куб без наложений.
  - picture: cube
    title: Противоположные грани
    text: Они стоят напротив друг друга и не имеют общей стороны.
  - picture: blocks
    title: Постройка из кубиков
    text: Считай и те кубики, которые скрыты.
  - picture: magnifier
    title: Вид сверху и вид сбоку
    text: Сверху видны занятые места, сбоку — высота видимых столбиков.
- kind: try
  text: Одну грань кубика покрасили красным. Сколько граней осталось непокрашенными?
  answer: 5. У куба 6 граней.
