status: active
difficulty: hard
question:
  text: |
    Можно ли полоску из шести квадратов на рисунке сложить по линиям между квадратами в куб, не разрезая её?
  images:
    - file: images/six-square-strip.png
      alt: >-
        Шесть одинаковых квадратов соединены сторонами в один горизонтальный ряд. Слева направо на них
        числа 1, 2, 3, 4, 5, 6.
answer:
  kind: single
  hide: true
  options:
    - id: 1
      text: 'Нельзя: полоска не закроет все шесть разных граней'
      correct: true
    - id: 2
      text: 'Можно: любые шесть квадратов дают развёртку куба'
    - id: 3
      text: 'Можно: достаточно сложить полоску пополам'
    - id: 4
      text: 'Можно: все грани будут в одном ряду'
    - id: 5
      text: 'Нельзя: у куба только пять граней'
points: 3
classification:
- subject: math
  concept: spatial-reasoning
learning:
  hint:
    text: >-
      Мысленно сверни четыре квадрата подряд в кольцо вокруг куба. Куда тогда лягут пятый и шестой квадраты?
explanation:
  text: |
    Из четырёх подряд идущих квадратов можно получить пояс вокруг куба. Следующие квадраты продолжат этот пояс и наложатся на уже занятые места. Крышку и дно такая полоска не закроет.
