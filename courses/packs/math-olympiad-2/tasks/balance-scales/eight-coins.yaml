status: active
difficulty: hard
question:
  text: |
    Среди 8 монет одна тяжелее. Ты хочешь найти её за два взвешивания. Сколько монет нужно положить на каждую чашу при первом взвешивании?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "0"
    - id: 2
      text: "1"
    - id: 3
      text: "2"
    - id: 4
      text: "4"
    - id: 5
      text: "3"
      correct: true
points: 3
classification:
- subject: math
  concept: processes-algorithms
learning:
  hint:
    text: >-
      У весов три исхода: левая чаша тяжелее, правая тяжелее или равновесие. Подбери первое взвешивание так, чтобы в любом исходе подозрительных монет осталось столько, что хватит одного взвешивания.
explanation:
  text: |
    Сравни 3 монеты с 3. Если одна чаша тяжелее, проверять нужно только её тройку. Если равновесие — только две оставшиеся. Среди двух или трёх монет тяжёлую можно найти за одно взвешивание. При выборе 1, 2 или 4 на чашу в одном из исходов останутся хотя бы 4 подозрительные монеты.
