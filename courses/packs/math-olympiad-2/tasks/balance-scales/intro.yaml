kind: theory
status: active
learning:
  title: Что тяжелее?
  subject: math
blocks:
- kind: says
  text: У чашечных весов нет цифр. Зато они честно показывают, что тяжелее.
- kind: facts
  items:
  - picture: scales
    title: Чаши на одном уровне
    text: Значит, грузы весят одинаково.
  - picture: minus
    title: Убери одинаковое
    text: Сними с обеих чаш одинаковые грузы. Равновесие сохранится.
  - picture: counters
    title: Ищешь тяжёлую монету?
    text: Дели монеты на группы. После взвешивания оставляй ту группу, где она ещё может быть.
- kind: try
  text: Весы в равновесии. Слева груша и яблоко, справа такое же яблоко и 2 сливы. Сколько слив весят столько же, сколько груша?
  answer: 2 сливы. Сними по яблоку с каждой чаши.
