question:
  text: |
    Весы в равновесии: на одной чаше 2 одинаковых яблока, на другой 6 одинаковых слив. Сколько слив весят столько же, сколько одно яблоко?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "3"
      correct: true
    - id: 2
      text: "1"
    - id: 3
      text: "2"
    - id: 4
      text: "4"
    - id: 5
      text: "5"
points: 1
