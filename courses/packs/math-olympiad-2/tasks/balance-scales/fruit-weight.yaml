- subject: math
  concept: linear-equations
- subject: math
  concept: whole-number-operations
learning:
  hint:
    text: >-
      Раздели содержимое каждой чаши на две равные части. Половинки тоже уравновесят друг друга.
explanation:
  text: |
    Раздели яблоки на две равные группы — по одному. Сливы тоже раздели поровну: по 3. Значит, одно яблоко уравновесят 3 сливы.
