status: active
difficulty: hard
question:
  text: |
    Среди 9 монет одна тяжелее, остальные одинаковые. За какое наименьшее число взвешиваний на чашечных весах можно наверняка найти тяжёлую?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "1"
    - id: 2
      text: "3"
    - id: 3
      text: "4"
    - id: 4
      text: "2"
      correct: true
    - id: 5
      text: "5"
points: 3
classification:
- subject: math
  concept: processes-algorithms
- subject: math
  concept: proof-methods
learning:
  hint:
    text: >-
      У весов три исхода. Подумай, на сколько равных групп поделить монеты, чтобы одно взвешивание сразу указало группу с тяжёлой монетой. И проверь, может ли хватить меньшего числа взвешиваний.
explanation:
  text: |
    Раздели монеты на три тройки. Сравни две тройки: тяжёлая монета в более тяжёлой или, при равновесии, в третьей. Затем сравни две монеты из нужной тройки. Одного взвешивания мало: у весов только три исхода, а выбрать нужно одну из девяти монет.
