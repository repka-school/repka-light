status: active
difficulty: hard
question:
  text: |
    На рисунке из палочек записано неверное равенство. Переложи одну палочку: убери вертикальную палочку из знака «+» и дополни ею цифру 6. Какое верное равенство получится?
  images:
    - file: images/match-equation.png
answer:
  kind: single
  hide: true
  options:
    - id: 1
      text: 6 − 4 = 4
    - id: 2
      text: 8 + 4 = 4
    - id: 3
      text: 6 + 4 = 8
    - id: 4
      text: 8 − 4 = 6
    - id: 5
      text: 8 − 4 = 4
      correct: true
points: 3
classification:
- subject: math
  concept: matchstick-puzzles
learning:
  hint:
    text: >-
      Нарисуй цифры из палочек, как на электронных часах. Посмотри, каким станет знак без вертикальной палочки и какой цифрой станет 6, если дополнить её ещё одной. Потом проверь равенство.
explanation:
  text: |
    Без вертикальной палочки знак «+» становится знаком «−». У цифры 6 не хватает верхней правой палочки: добавь её и получи 8. Получается 8 − 4 = 4. Переложена ровно одна палочка.
