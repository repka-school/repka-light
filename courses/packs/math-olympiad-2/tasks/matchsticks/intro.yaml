kind: theory
status: active
learning:
  title: Одна палочка на двоих
  subject: math
blocks:
- kind: says
  text: Фигуры из палочек стоят рядом. Тогда одна палочка служит сразу двум!
- kind: facts
  items:
  - picture: sticks
    title: Общая сторона
    text: Палочку на ней считай один раз.
- kind: steps
  title: Если палочку нужно переложить
  items:
  - picture: minus
    title: Найди, откуда убрать палочку
  - picture: plus
    title: Найди, куда её положить
  - picture: check
    title: Проверь
    text: Переложено столько палочек, сколько разрешено в условии?
- kind: try
  text: Два треугольника из палочек стоят рядом, и одна сторона у них общая. Сколько всего палочек?
  answer: 5. У двух отдельных треугольников 6 палочек, но одна здесь общая.
