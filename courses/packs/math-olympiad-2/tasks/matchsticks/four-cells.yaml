question:
  text: |
    Из палочек сложили квадрат 2 на 2 клетки. Каждая сторона одной клетки — одна палочка. Сколько палочек понадобилось?
  images:
    - file: images/four-squares.png
      alt: >-
        Через середину квадрата от края до края проходят одна горизонтальная и одна вертикальная линия.
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "10"
    - id: 2
      text: "11"
    - id: 3
      text: "13"
    - id: 4
      text: "12"
      correct: true
    - id: 5
      text: "14"
points: 2
classification:
- subject: math
  concept: matchstick-puzzles
learning:
  hint:
    text: >-
      Считай палочки по направлениям: сначала все горизонтальные, ряд линий за рядом, потом все вертикальные. Общая сторона двух соседних клеток — одна палочка.
explanation:
  text: |
    Сверху, посередине и снизу по 2 горизонтальные палочки: всего 6. Вертикальных тоже 6. Вместе 6 + 6 = 12.
