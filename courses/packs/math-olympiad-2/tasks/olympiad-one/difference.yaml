question:
  text: |
    В двух коробках 18 карандашей. В первой на 4 больше, чем во второй. Сколько во второй?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "5"
    - id: 2
      text: "6"
    - id: 3
      text: "7"
      correct: true
    - id: 4
      text: "8"
    - id: 5
      text: "9"
points: 3
