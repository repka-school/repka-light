- subject: math
  concept: sum-difference
learning:
  hint:
    text: >-
      Если убрать из первой коробки лишние карандаши, в коробках станет поровну. Подумай, сколько карандашей тогда останется всего и как узнать, сколько в каждой коробке.
explanation:
  text: |
    Убери из первой коробки лишние 4: останется 14 поровну в двух коробках, то есть по 7. Проверка: 7 и 11 вместе дают 18, разница 4.
