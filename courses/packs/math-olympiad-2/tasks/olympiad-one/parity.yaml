status: active
difficulty: medium
question:
  text: |
    Можно ли получить 12, сложив три нечётных числа?
answer:
  kind: single
  hide: true
  options:
    - id: 1
      text: 'Да: 3 + 3 + 6'
    - id: 2
      text: 'Да: 1 + 5 + 6'
    - id: 3
      text: 'Да: 1 + 3 + 8'
    - id: 4
      text: 'Нет: сумма трёх нечётных чисел нечётная'
      correct: true
    - id: 5
      text: 'Нет: три числа всегда меньше 12'
points: 2
classification:
- subject: math
  concept: parity
learning:
  hint:
    text: >-
      Разложи каждое нечётное число на пары: у каждого останется один предмет. Подумай, сколько одиночек наберётся у трёх чисел и смогут ли они все собраться в пары.
explanation:
  text: |
    У каждого нечётного числа есть один предмет без пары. Из трёх таких предметов один останется без пары. Сумма нечётная, а 12 — чётное.
