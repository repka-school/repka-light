status: active
difficulty: hard
question:
  text: |
    У Иры, Лены и Нади по одной разной ленте: красной, синей или белой. У Иры не красная и не синяя. У Лены не красная. Какая лента у Нади?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: Белая
    - id: 2
      text: Синяя
    - id: 3
      text: Зелёная
    - id: 4
      text: Определить нельзя
    - id: 5
      text: Красная
      correct: true
points: 3
classification:
- subject: math
  concept: logic-tables
learning:
  hint:
    text: >-
      Начни с девочки, про которую сказано больше всего: у неё остаётся только один цвет. Потом вычеркни этот цвет у остальных и посмотри, что осталось.
explanation:
  text: |
    Ире остаётся белая лента. Лене нельзя красную, а белая уже занята: значит, у неё синяя. Наде достаётся красная.
