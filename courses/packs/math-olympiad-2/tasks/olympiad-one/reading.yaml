question:
  text: |
    У Лизы было 9 открыток. Три она подарила бабушке, две — другу. Сколько открыток Лиза подарила?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "5"
      correct: true
    - id: 2
      text: "3"
    - id: 3
      text: "4"
    - id: 4
      text: "6"
    - id: 5
      text: "7"
points: 1
