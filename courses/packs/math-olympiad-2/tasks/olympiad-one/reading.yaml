- subject: math
  concept: whole-number-operations
learning:
  hint:
    text: >-
      Прочитай вопрос ещё раз: спрашивают, сколько открыток осталось или сколько подарено? Выбери из условия только те числа, которые для этого нужны.
explanation:
  text: |
    Сложи только подаренные открытки: 3 + 2 = 5. Число 9 говорит, сколько было сначала, но вопрос о подаренных.
