status: active
difficulty: hard
question:
  text: |
    Каждый герой — рыцарь или лжец. Рыцарь всегда говорит правду, лжец — неправду. Артём говорит: «Мы с Борей оба лжецы». Кто они?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: Оба — рыцари
    - id: 2
      text: Оба — лжецы
    - id: 3
      text: Артём — лжец, Боря — рыцарь
      correct: true
    - id: 4
      text: Артём — рыцарь, Боря — лжец
    - id: 5
      text: Определить нельзя
points: 3
classification:
- subject: math
  concept: truth-and-lies
learning:
  hint:
    text: >-
      Начни с Артёма: может ли рыцарь правдиво сказать про себя «я лжец»? Когда поймёшь, кто Артём, реши, верна ли его фраза целиком и что это значит для Бори.
explanation:
  text: |
    Если Артём — рыцарь, он не может правдиво назвать себя лжецом. Значит, Артём — лжец.
    Его фраза «оба лжецы» неверна. Сам он лжец, поэтому Боря должен быть рыцарем.
