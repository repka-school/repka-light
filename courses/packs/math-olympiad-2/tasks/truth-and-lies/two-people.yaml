status: active
difficulty: medium
question:
  text: |
    Каждый герой — рыцарь или лжец. Рыцарь всегда говорит правду, лжец — неправду. Аня говорит: «Боря — лжец». Боря говорит: «Аня — лжец». Что можно узнать?
answer:
  kind: single
  hide: true
  options:
    - id: 1
      text: Оба — рыцари
    - id: 2
      text: Один — рыцарь, другой — лжец; кто именно, пока неизвестно
      correct: true
    - id: 3
      text: Оба — лжецы
    - id: 4
      text: Только Аня может быть рыцарем
    - id: 5
      text: Только Боря может быть рыцарем
points: 2
classification:
- subject: math
  concept: truth-and-lies
learning:
  hint:
    text: >-
      Предположи, что Аня — рыцарь, и проверь обе фразы: нет ли противоречия? Потом так же предположи, что Аня — лжец. Посмотри, сколько случаев подошло.
explanation:
  text: |
    Если Аня — рыцарь, её слова верны: Боря — лжец. Тогда Боря неправильно называет Аню лжецом.
    Если Аня — лжец, Боря — рыцарь, и его слова об Ане верны. Оба случая подходят. Уточнить, кто рыцарь, нельзя.
