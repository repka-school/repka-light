status: active
difficulty: hard
question:
  text: |
    Приз лежит в одной из трёх коробок: 1, 2 или 3. На коробке 1 написано «Приз здесь», на коробке 2 — «Приз не здесь», на коробке 3 — «Приз не в коробке 1». Верна ровно одна надпись. Где приз?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: В коробке 1
    - id: 2
      text: В коробке 3
    - id: 3
      text: В любой из трёх
    - id: 4
      text: Условия выполнить нельзя
    - id: 5
      text: В коробке 2
      correct: true
points: 3
classification:
- subject: math
  concept: truth-and-lies
learning:
  hint:
    text: >-
      Проверяй по очереди: положи приз в коробку 1, потом в 2, потом в 3 и каждый раз посчитай, сколько надписей тогда верны. Подходит только случай, где верна ровно одна.
explanation:
  text: |
    Если приз в коробке 1, верны первые две надписи — не подходит. Если в коробке 2, верна только третья — подходит. Если в коробке 3, верны вторая и третья — снова не подходит. Ответ: коробка 2.
