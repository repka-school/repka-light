status: active
difficulty: medium
question:
  text: |
    Каждый герой — рыцарь или лжец. Рыцарь всегда говорит правду, лжец — неправду. Известно, что Вера — рыцарь. Вера говорит: «Глеб — лжец». Глеб говорит: «Дина — лжец». Кто Дина?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: Лжец
    - id: 2
      text: И рыцарь, и лжец
    - id: 3
      text: Ни рыцарь, ни лжец
    - id: 4
      text: Рыцарь
      correct: true
    - id: 5
      text: Узнать нельзя
points: 2
classification:
- subject: math
  concept: truth-and-lies
learning:
  hint:
    text: >-
      Начни с того, что известно точно: Вера говорит правду. Узнай из её слов, кто Глеб, и реши, можно ли верить тому, что Глеб говорит о Дине.
explanation:
  text: |
    Вера говорит правду, поэтому Глеб — лжец. Его слова о Дине неверны. Значит, Дина не лжец, а рыцарь.
