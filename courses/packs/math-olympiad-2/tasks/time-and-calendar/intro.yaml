kind: theory
status: active
learning:
  title: Время идёт по кругу
  subject: math
blocks:
- kind: says
  text: Минуты бегут по кругу, и дни недели тоже. Круг закончился — начинается новый!
- kind: facts
  items:
  - picture: clock
    title: В часе 60 минут
    text: Час закончился? Начни минуты нового часа с нуля.
  - picture: calendar
    title: В неделе 7 дней
    text: Дни недели повторяются через 7 дней. В длинном сроке сначала отбрось полные недели.
  - picture: roman
    title: Римские цифры
    text: I — это 1, V — это 5, X — это 10. Например, VIII — это 5 + 1 + 1 + 1.
- kind: try
  text: Сегодня суббота. Какой день недели будет через 7 дней?
  answer: Снова суббота. Дни недели повторяются через 7 дней.
