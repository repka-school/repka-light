status: active
difficulty: easy
question:
  text: |
    В трёх клетках стоят числа 4, неизвестное число и 3. Их сумма равна 12. Какое число пропущено?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "5"
      correct: true
    - id: 2
      text: "3"
    - id: 3
      text: "4"
    - id: 4
      text: "6"
    - id: 5
      text: "7"
points: 1
classification:
- subject: math
  concept: magic-squares
learning:
  hint:
    text: >-
      Сначала сложи два известных числа. Потом подумай, сколько не хватает от этой суммы до общей суммы трёх клеток.
explanation:
  text: |
    Известные числа дают 4 + 3 = 7. До 12 не хватает 5: 12 − 7 = 5. Проверь: 4 + 5 + 3 = 12.
