status: active
difficulty: hard
question:
  text: |
    В квадрат 2 на 2 клетки нужно вписать числа 1, 2, 3, 4, каждое один раз. Можно ли сделать сумму в каждом из двух рядов равной 6?
answer:
  kind: single
  hide: true
  options:
    - id: 1
      text: 'Можно: в рядах 1, 4 и 2, 3'
    - id: 2
      text: 'Можно: в рядах 1, 2 и 3, 4'
    - id: 3
      text: 'Нельзя: число 4 слишком большое'
    - id: 4
      text: 'Можно: повторить число 4'
    - id: 5
      text: 'Нельзя: для двух рядов нужно всего 12, а сумма чисел равна 10'
      correct: true
points: 3
classification:
- subject: math
  concept: double-counting
learning:
  hint:
    text: >-
      Сложи все четыре числа. Потом подумай, какой должна быть сумма всех чисел квадрата, если каждый из двух рядов даёт 6. Сравни.
explanation:
  text: |
    Сложи все числа: 1 + 2 + 3 + 4 = 10. Если бы каждый ряд давал 6, общая сумма была бы 6 + 6 = 12. Одни и те же четыре числа не могут дать и 10, и 12. Значит, выполнить условие нельзя.
