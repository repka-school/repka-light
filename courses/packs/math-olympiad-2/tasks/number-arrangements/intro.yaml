kind: theory
status: active
learning:
  title: Какое число спряталось?
  subject: math
blocks:
- kind: says
  text: В клетках стоят числа, а одно спряталось. Сумма подскажет, какое!
- kind: steps
  items:
  - picture: magnifier
    title: Найди лёгкое место
    text: Строку или сторону, где неизвестно только одно число.
  - picture: plus
    title: Сложи известные числа
    text: Сколько не хватает до нужной суммы?
  - picture: cells
    title: Впиши число
    text: И проверь все условия, которых касается эта клетка.
- kind: tip
  picture: table
  text: В квадрате могут быть важны строки, столбцы и диагонали. Прочитай, какие именно.
- kind: try
  text: В трёх клетках стоят 2, неизвестное число и 5. Их сумма равна 10. Какое число спряталось?
  answer: 3. Известные числа дают 2 + 5 = 7. До 10 не хватает 3.
