status: active
difficulty: medium
question:
  text: |
    У Лены 2 юбки: красная и синяя. Ещё у неё 3 футболки: белая, жёлтая и зелёная. Для наряда она выбирает одну юбку и одну футболку.
    Сколько разных нарядов можно составить?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: 3 наряда
    - id: 2
      text: 5 нарядов
    - id: 3
      text: 6 нарядов
      correct: true
    - id: 4
      text: 8 нарядов
    - id: 5
      text: 9 нарядов
points: 2
classification:
- subject: math
  concept: counting
learning:
  hint:
    text: >-
      Возьми сначала одну юбку и перечисли все футболки, которые к ней можно надеть. Потом сделай то же самое для другой юбки.
explanation:
  text: |
    С красной юбкой можно надеть белую, жёлтую или зелёную футболку. Это 3 наряда.
    С синей юбкой получатся ещё 3 наряда с теми же футболками. Всего 3 + 3 = 6 нарядов.
    Все наряды разные: у них отличается юбка или футболка.
