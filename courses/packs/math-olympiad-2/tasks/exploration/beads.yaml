learning:
  hint:
    text: >-
      Бусины идут группами, которые повторяются. Найди, сколько полных групп помещается до нужной бусины и каким по счёту в своей группе она оказывается.
explanation:
  text: |
    Запиши первые 10 бусин по порядку: красная, красная, синяя; красная, красная, синяя; красная, красная, синяя; красная.
    После 9-й синей начинается новая тройка. Поэтому 10-я бусина красная.
