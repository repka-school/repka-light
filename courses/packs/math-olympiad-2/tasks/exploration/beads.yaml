question:
  text: |
    Бусины повторяются в таком порядке: красная, красная, синяя. Потом снова красная, красная, синяя — и так дальше.
    Какого цвета 10-я бусина?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: Синяя
    - id: 2
      text: Жёлтая
    - id: 3
      text: Зелёная
    - id: 4
      text: Красная
      correct: true
    - id: 5
      text: Белая
