status: active
difficulty: hard
question:
  text: |
    На рисунке — конверт с открытым клапаном. Перерисуй его на лист бумаги.
    Попробуй обвести все линии, не отрывая карандаша. По каждой линии можно пройти только один раз.
    Из каких точек можно начать, чтобы это получилось?
  images:
    - file: images/open-envelope.png
      alt: >-
        У конверта квадрат с двумя пересекающимися диагоналями. Нижние углы слева направо — 1 и 2,
        верхние — 4 и 3. Точка пересечения диагоналей без номера. Над квадратом вершина клапана 5, к ней
        идут линии от 4 и 3.
answer:
  kind: single
  hide: true
  options:
    - id: 1
      text: Только из точки 5
    - id: 2
      text: Из точки 3 или 4
    - id: 3
      text: Из любой точки от 1 до 5
    - id: 4
      text: Из точки 1 или 2
      correct: true
    - id: 5
      text: Только из центра квадрата
points: 3
classification:
- subject: math
  concept: graphs
- subject: math
  concept: parity
learning:
  hint:
    text: >-
      Посчитай в каждой точке, сколько линий в ней сходится. Если линий нечётное число, в этой точке путь обязательно начинается или заканчивается.
explanation:
  text: |
    Начни в точке 1 и проведи путь: 1 → 4 → 5 → 3 → 4 → 2 → 3 → 1 → 2.
    На пересечении диагоналей внутри квадрата каждый раз иди прямо. Так ты пройдёшь все линии ровно по одному разу.
    Если пройти этот путь в обратном порядке, начало будет в точке 2.
    В каждой нижней точке сходятся 3 линии. Одна нужна, чтобы прийти, другая — чтобы уйти. Третья остаётся без пары. Поэтому в одной нижней точке путь начинается, а в другой заканчивается.
