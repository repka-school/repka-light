status: active
difficulty: hard
question:
  text: |
    Есть 7 конфет и 3 коробки. Каждую конфету нужно положить в одну коробку. Коробки стоят отдельно, конфеты делить нельзя. Пустую коробку оставить можно.
    Можно ли разложить все конфеты так, чтобы в каждой коробке они делились на пары без остатка? Выбери ответ с верным объяснением.
answer:
  kind: single
  hide: true
  options:
    - id: 1
      text: 'Да: положить 2, 2 и 3 конфеты'
    - id: 2
      text: 'Нет: если раскладывать парами, одна конфета останется без пары'
      correct: true
    - id: 3
      text: 'Да: положить все 7 конфет в одну коробку'
    - id: 4
      text: 'Нет: конфет обязательно должно быть столько же, сколько коробок'
    - id: 5
      text: 'Да: положить 2, 2 и 2 конфеты, а одну оставить на столе'
points: 3
classification:
- subject: math
  concept: parity
learning:
  hint:
    text: >-
      Если в каждой коробке конфеты лежат парами, то как будут лежать все конфеты, если ссыпать их вместе? Разложи 7 пуговиц парами и посмотри, что выйдет.
explanation:
  text: |
    Разложи 7 пуговиц парами: получится 3 пары и ещё 1 пуговица. У неё нет пары.
    Если в каждой коробке конфеты лежат парами, то и все конфеты вместе можно собрать в пары. Но 7 конфет так собрать нельзя.
    Значит, нужного расклада нет. Пустая коробка не поможет найти пару для седьмой конфеты.
