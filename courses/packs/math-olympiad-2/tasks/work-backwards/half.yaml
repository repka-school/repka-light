    text: >-
      Иди с конца: верни Маше последние отданные наклейки. Сколько тогда у неё было и какая это часть от начального количества?
explanation:
  text: |
    До последних двух наклеек у Маши было 4 + 2 = 6. Это половина начального количества. Обе половины вместе: 6 + 6 = 12. Проверь: после половины осталось 6, после ещё двух — 4.
