- subject: math
  concept: backward-reasoning
learning:
  hint:
    text: >-
      Сначала верни убранные фишки. Потом подумай: из каких двух равных кучек сложилось это число?
explanation:
  text: |
    Верни убранные 4: получится 14. До этого были две равные кучки — начальная и добавленная. В каждой по 7, потому что 7 + 7 = 14. Проверка: 7 + 7 − 4 = 10.
