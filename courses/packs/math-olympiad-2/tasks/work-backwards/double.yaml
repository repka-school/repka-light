question:
  text: |
    Петя взял несколько фишек, добавил ещё столько же, потом убрал 4. Осталось 10. Сколько фишек Петя взял сначала?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "5"
    - id: 2
      text: "6"
    - id: 3
      text: "8"
    - id: 4
      text: "9"
    - id: 5
      text: "7"
      correct: true
points: 3
