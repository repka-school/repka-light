kind: theory
status: active
learning:
  title: Точки и линии
  subject: math
blocks:
- kind: says
  text: Нарисуй город точкой, а дорогу — линией между точками. Такая схема называется графом.
- kind: facts
  items:
  - picture: graph
    title: Схема — не карта
    text: Длина линии на рисунке не обязана совпадать с длиной дороги.
  - picture: check
    title: Каждую дорогу считай один раз
    text: По дороге можно идти в обе стороны, если не сказано иначе.
  - picture: arrow
    title: Короткий путь
    text: Считай, сколько дорог проходишь.
- kind: try
  text: 'Три города соединили дорогами: каждый с каждым. Сколько получилось дорог?'
  answer: 3. Нарисуй три точки и соедини их. Получится треугольник.
