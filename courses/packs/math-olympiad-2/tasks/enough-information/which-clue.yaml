question:
  text: |
    В коробке лежат красные и синие кубики. Красных 4. Какой подсказки достаточно, чтобы узнать число синих?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: Коробка квадратная
    - id: 2
      text: У всех кубиков одинаковый размер
    - id: 3
      text: Всего в коробке 9 кубиков
      correct: true
    - id: 4
      text: Коробка стоит на столе
    - id: 5
      text: На коробке нарисовано 9 звёзд
points: 2
