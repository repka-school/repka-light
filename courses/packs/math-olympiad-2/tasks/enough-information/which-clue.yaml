learning:
  hint:
    text: >-
      Чтобы найти число синих кубиков, тебе нужно ещё одно число про кубики. Какая подсказка позволяет найти синие вычитанием?
explanation:
  text: |
    Если всего 9 кубиков, синих 9 − 4 = 5. Остальные подсказки ничего не говорят о количестве синих кубиков.
