kind: theory
status: active
learning:
  title: Хватает ли подсказок?
  subject: math
blocks:
- kind: says
  text: В задаче бывают лишние числа. А бывает, что нужного числа нет вовсе!
- kind: steps
  items:
  - picture: question
    title: Скажи, что нужно узнать
    text: Сделай это ещё до счёта.
  - picture: magnifier
    title: Отметь нужные данные
    text: Некоторые числа могут оказаться лишними.
  - picture: swap
    title: Данных не хватает?
    text: Покажи два случая, которые подходят к условию, но дают разные ответы. Это тоже решение.
- kind: try
  text: У Вити было несколько конфет. Две он съел. Сколько конфет осталось?
  answer: Узнать нельзя. Неизвестно, сколько конфет было сначала.
