status: active
difficulty: hard
question:
  text: |
    На одном берегу взрослый и двое детей. Лодка выдерживает одного взрослого или одного-двух детей. Все умеют грести. Какое наименьшее число рейсов нужно, чтобы все оказались на другом берегу?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "3"
    - id: 2
      text: "4"
    - id: 3
      text: "5"
      correct: true
    - id: 4
      text: "6"
    - id: 5
      text: "7"
points: 3
classification:
- subject: math
  concept: processes-algorithms
- subject: math
  concept: proof-methods
learning:
  hint:
    text: >-
      Взрослый занимает лодку целиком, а пригнать лодку назад может ребёнок. Подумай, кто должен ждать на другом берегу, чтобы вернуть лодку после рейса взрослого.
explanation:
  text: |
    Двое детей плывут туда; один возвращается. Взрослый плывёт туда один; второй ребёнок возвращается за первым. Оба ребёнка плывут туда. Всего 5 рейсов. Взрослому нужен отдельный рейс, а для двух доставок лодки обратно нужны ещё два; двух рейсов с детьми туда тоже не избежать.
