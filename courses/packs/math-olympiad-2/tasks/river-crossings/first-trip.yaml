status: active
difficulty: easy
question:
  text: |
    Человек перевозит волка, козу и капусту. В лодке помещаются человек и кто-то один из них. Без человека волк съест козу, а коза — капусту. Кого нужно перевезти первым?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: Козу
      correct: true
    - id: 2
      text: Волка
    - id: 3
      text: Капусту
    - id: 4
      text: 'Никого: плыть одному'
    - id: 5
      text: Можно начать с любого
points: 1
classification:
- subject: math
  concept: processes-algorithms
learning:
  hint:
    text: >-
      Для каждого груза проверь, кто останется на берегу без человека после первого рейса. Подойдёт только тот выбор, при котором никого не съедят.
explanation:
  text: |
    Если увезти волка, коза останется с капустой. Если капусту — волк останется с козой. Перевези козу: волк капусту не ест, их можно оставить вместе.
