status: active
difficulty: medium
question:
  text: |
    Человек уже перевёз козу и вернулся один. Волк и капуста ещё на первом берегу. В лодке помещаются человек и один груз. Без человека нельзя оставлять волка с козой, а козу — с капустой. Кого можно перевезти следующим, чтобы затем закончить переправу?
answer:
  kind: single
  hide: true
  options:
    - id: 1
      text: Только волка, а обратно вернуться одному
    - id: 2
      text: Волка или капусту, а козу потом вернуть обратно
      correct: true
    - id: 3
      text: Только капусту, а обратно вернуться одному
    - id: 4
      text: Сразу волка и капусту в одной лодке
    - id: 5
      text: 'Никого: переправа невозможна'
points: 2
classification:
- subject: math
  concept: processes-algorithms
learning:
  hint:
    text: >-
      Когда второй груз окажется на другом берегу рядом с козой, их нельзя оставить вдвоём. Подумай, нельзя ли кого-то везти и в обратную сторону.
explanation:
  text: |
    Можно привезти волка к козе, но обратно нужно забрать козу. Затем перевезти капусту, вернуться одному и привезти козу. Если вторым грузом выбрать капусту, работает такой же порядок с обменом волка и капусты. В лодке человек и один груз.
