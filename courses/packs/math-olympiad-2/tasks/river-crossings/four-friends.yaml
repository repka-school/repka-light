status: active
difficulty: hard
question:
  text: |
    Четверо друзей хотят переплыть реку. Лодка вмещает не больше двоих, каждый умеет грести. Лодку нельзя отправлять пустой. Сколько рейсов нужно как минимум?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "3"
    - id: 2
      text: "4"
    - id: 3
      text: "6"
    - id: 4
      text: "5"
      correct: true
    - id: 5
      text: "7"
points: 3
classification:
- subject: math
  concept: processes-algorithms
- subject: math
  concept: proof-methods
learning:
  hint:
    text: >-
      Каждый раз, кроме последнего, кто-то должен пригнать лодку обратно. Посчитай, на сколько человек за пару рейсов туда и обратно растёт группа на другом берегу.
explanation:
  text: |
    Двое плывут туда, один обратно; двое туда, один обратно; двое туда. Это 5 рейсов. После первой переправы с возвратом на другом берегу остаётся один друг. После второй такой переправы — двое. Последним рейсом приплывают оставшиеся двое. Двух рейсов туда с одним возвращением хватило бы только на троих.
