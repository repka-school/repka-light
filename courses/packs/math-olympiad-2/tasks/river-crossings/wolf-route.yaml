status: active
difficulty: hard
question:
  text: |
    Человек перевозит волка, козу и капусту в лодке: человек и один груз за рейс. Без человека нельзя оставлять волка с козой или козу с капустой. Сколько рейсов нужно как минимум для всей переправы?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "5"
    - id: 2
      text: "6"
    - id: 3
      text: "8"
    - id: 4
      text: "9"
    - id: 5
      text: "7"
      correct: true
points: 3
classification:
- subject: math
  concept: processes-algorithms
- subject: math
  concept: proof-methods
learning:
  hint:
    text: >-
      Начни с козы: волк и капуста не трогают друг друга. Помни, что груз можно везти и обратно, и считай рейсы в обе стороны.
explanation:
  text: |
    Порядок: коза туда, человек обратно, волк туда, коза обратно, капуста туда, человек обратно, коза туда. Всего 7. Козу приходится вернуть: иначе после доставки следующего груза её нельзя оставить с ним. Поэтому нужно не меньше четырёх рейсов туда и трёх обратно.
