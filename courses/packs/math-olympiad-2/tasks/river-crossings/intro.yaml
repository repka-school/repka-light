kind: theory
status: active
learning:
  title: Все на тот берег!
  subject: math
blocks:
- kind: says
  text: Лодка маленькая, а переправиться нужно всем. И правила нельзя нарушать ни на минуту!
- kind: steps
  items:
  - picture: boat
    title: Отмечай каждый рейс
    text: Кто остался на каждом берегу? Где лодка?
  - picture: check
    title: Проверяй правила
    text: После каждого шага, а не только в конце.
  - picture: rewind
    title: Обратный путь — тоже рейс
    text: Если лодка вернулась, считай и этот рейс.
- kind: tip
  picture: swap
  text: Иногда ради следующего шага приходится привезти кого-то обратно.
- kind: try
  text: Перевозчик отвёз друга на другой берег и вернулся один. Сколько рейсов сделала лодка?
  answer: '2: туда и обратно.'
