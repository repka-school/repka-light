- subject: math
  concept: games-strategies
learning:
  hint:
    text: >-
      Ищи ход, после которого последний камень окажется у тебя в руке уже сейчас, и проверь, разрешён ли он правилами.
explanation:
  text: |
    Возьми оба камня. Среди них последний, значит, игра закончится твоей победой.
