status: active
difficulty: hard
question:
  text: |
    В двух кучках по 4 камня. За ход можно взять любое положительное число камней только из одной кучки. Последний камень приносит победу. Какая стратегия гарантирует победу?
answer:
  kind: single
  hide: true
  options:
    - id: 1
      text: Первому забрать одну кучку целиком
    - id: 2
      text: Второму всегда брать ровно один камень
    - id: 3
      text: Первому всегда брать ровно два камня
    - id: 4
      text: Первому сразу забрать обе кучки
    - id: 5
      text: Второму повторять ход первого в другой кучке
      correct: true
points: 3
classification:
- subject: math
  concept: games-strategies
learning:
  hint:
    text: >-
      Заметь, что кучки сейчас равны. Сыграй за обоих на маленьком примере, по 1 или по 2 камня в кучке, и посмотри, кому выгодно, когда перед ходом соперника кучки равны.
explanation:
  text: |
    После каждого хода второго кучки снова равны. Если первый взял несколько камней из одной кучки, во второй столько же камней для ответа точно есть. Когда первый опустошит одну кучку, второй опустошит другую и возьмёт последний камень.
