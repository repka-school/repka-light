status: active
difficulty: medium
question:
  text: |
    На столе 3 камня. За ход можно взять 1 или 2, последний камень приносит победу. Кто может обеспечить себе победу?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: Первый игрок
    - id: 2
      text: Второй игрок
      correct: true
    - id: 3
      text: Оба игрока одновременно
    - id: 4
      text: 'Никто: всегда ничья'
    - id: 5
      text: Первый, если возьмёт один камень
points: 2
classification:
- subject: math
  concept: games-strategies
learning:
  hint:
    text: >-
      Проверь оба возможных хода первого игрока: сколько камней останется второму и сможет ли он забрать их все за один ход?
explanation:
  text: |
    Если первый возьмёт 1, второй заберёт 2. Если первый возьмёт 2, второй заберёт 1. В обоих случаях последний камень достаётся второму.
