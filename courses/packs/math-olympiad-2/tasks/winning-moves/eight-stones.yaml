status: active
difficulty: hard
question:
  text: |
    На столе 8 камней. За ход берут 1 или 2, последний камень приносит победу. Какой первый ход даёт тебе победу при верной дальнейшей игре?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "0"
    - id: 2
      text: "1"
    - id: 3
      text: "3"
    - id: 4
      text: "2"
      correct: true
    - id: 5
      text: "4"
points: 3
classification:
- subject: math
  concept: games-strategies
learning:
  hint:
    text: >-
      Придумай, как отвечать на любой ход соперника, чтобы за пару ходов (его и твой) всегда уходило одно и то же число камней. Потом подумай, сколько камней надо оставить ему первым ходом, чтобы так можно было дойти до конца.
explanation:
  text: |
    Возьми 2, оставив 6. Потом дополняй каждый ход соперника до трёх: на 1 бери 2, на 2 бери 1. После вашей пары ходов останется 3, после следующей — 0. Последний ход будет твоим.
