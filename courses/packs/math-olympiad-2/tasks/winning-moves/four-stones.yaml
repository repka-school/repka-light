status: active
difficulty: medium
question:
  text: |
    На столе 4 камня. За ход берут 1 или 2, последний камень приносит победу. Сколько нужно взять первым ходом, чтобы выиграть при любом ответе соперника?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "0"
    - id: 2
      text: "2"
    - id: 3
      text: "1"
      correct: true
    - id: 4
      text: "3"
    - id: 5
      text: "4"
points: 2
classification:
- subject: math
  concept: games-strategies
learning:
  hint:
    text: >-
      Проверь каждый возможный первый ход: сколько камней останется сопернику и сможет ли он при любом своём ходе не дать тебе забрать последний?
explanation:
  text: |
    Возьми 1 и оставь 3. Если соперник возьмёт 1, тебе останутся 2; если возьмёт 2, тебе останется 1. Ты заберёшь остаток. Если первым взять 2, соперник заберёт последние 2.
