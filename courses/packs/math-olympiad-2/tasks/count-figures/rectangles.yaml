question:
  text: |
    Сколько прямоугольников всех размеров на рисунке? Квадраты тоже считай прямоугольниками.
  images:
    - file: images/four-squares.png
      alt: >-
        Через середину квадрата от края до края проходят одна горизонтальная и одна вертикальная линия.
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "7"
    - id: 2
      text: "8"
    - id: 3
      text: "10"
    - id: 4
      text: "9"
      correct: true
    - id: 5
      text: "11"
points: 3
classification:
- subject: math
  concept: counting
- subject: math
