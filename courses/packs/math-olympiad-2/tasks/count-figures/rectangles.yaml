learning:
  hint:
    text: >-
      Считай прямоугольники по размерам: из одной клетки, из двух клеток лёжа, из двух клеток стоя, из всех клеток сразу.
explanation:
  text: |
    Есть 4 маленьких квадрата, 2 прямоугольника из двух клеток по горизонтали, 2 по вертикали и 1 большой квадрат. Всего 4 + 2 + 2 + 1 = 9.
