kind: theory
status: active
learning:
  title: Большие фигуры прячутся
  subject: math
blocks:
- kind: says
  text: 'Маленькие фигуры видно сразу. А большие прячутся: они сложены из маленьких!'
- kind: steps
  items:
  - picture: grid-small
    title: Сосчитай маленькие
    text: Начни с самых маленьких фигур.
  - picture: grid-big
    title: Ищи составные
    text: Те, что сложены из нескольких маленьких.
  - picture: pencil
    title: Отмечай найденные
    text: Или называй их углы. Так ты не собьёшься.
- kind: try
  text: Две клетки стоят рядом. Сколько здесь прямоугольников? Квадрат тоже считай прямоугольником.
  answer: 3. Две клетки и ещё один прямоугольник из двух клеток.
