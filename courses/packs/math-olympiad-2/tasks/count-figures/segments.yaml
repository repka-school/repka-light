status: active
difficulty: medium
question:
  text: |
    На прямой отмечены четыре точки с номерами 1, 2, 3, 4. Сколько разных отрезков с концами в этих точках?
  images:
    - file: images/four-points.png
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "4"
    - id: 2
      text: "6"
      correct: true
    - id: 3
      text: "5"
    - id: 4
      text: "7"
    - id: 5
      text: "8"
points: 2
classification:
- subject: math
  concept: counting
- subject: math
  concept: arrangements
learning:
  hint:
    text: >-
      Отрезок задают два конца. Бери точки по очереди и считай отрезки только до точек правее, чтобы не посчитать один отрезок дважды.
explanation:
  text: |
    От точки 1 идут отрезки до 2, 3, 4 — три. От точки 2 остаются новые отрезки до 3 и 4 — два. Ещё есть отрезок 3–4. Всего 3 + 2 + 1 = 6.
