status: active
difficulty: medium
question:
  text: |
    Квадрат с одной диагональю нужно обвести одним росчерком, не повторяя линии. В каких отмеченных точках может быть начало?
  images:
    - file: images/square-one-diagonal.png
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: В 2 или 4
    - id: 2
      text: Только в 1
    - id: 3
      text: В 1 или 3
      correct: true
    - id: 4
      text: В любой из четырёх
    - id: 5
      text: Обвести невозможно
points: 2
classification:
- subject: math
  concept: graphs
learning:
  hint:
    text: >-
      Посчитай, сколько линий сходится в каждой отмеченной точке. Если в точке нечётное число линий, росчерк должен в ней начаться или закончиться.
explanation:
  text: |
    В точках 1 и 3 сходятся по три линии, в остальных — по две. Начинай в 1 и иди 1 → 2 → 3 → 4 → 1 → 3. Обратный путь начинается в 3.
