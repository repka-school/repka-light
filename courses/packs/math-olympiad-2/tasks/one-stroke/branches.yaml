learning:
  hint:
    text: >-
      Посмотри на точки, из которых выходит только одна линия: можно ли пройти такую точку насквозь? Подумай, сколько таких точек может быть у одного росчерка: у него только одно начало и один конец.
explanation:
  text: |
    В каждом из концов 2, 3, 4 только одна линия. Два конца могут стать началом и концом пути, но из третьего придётся возвращаться по той же линии. Это запрещено.
