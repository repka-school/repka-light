kind: theory
status: active
learning:
  title: Не отрывая карандаша
  subject: math
blocks:
- kind: says
  text: Обведи все линии, не отрывая карандаша. По каждой линии можно пройти только один раз. Возвращаться в точку можно.
- kind: tip
  picture: magnifier
  text: Сначала сосчитай, сколько линий сходится в каждой точке.
- kind: facts
  title: Сколько точек с нечётным числом линий?
  items:
  - picture: zero
    title: Ни одной
    text: Начинай где хочешь. Путь вернётся к началу.
  - picture: two
    title: Ровно две
    text: Начинай в одной и заканчивай в другой.
  - picture: four
    title: Больше двух
    text: Одного росчерка не хватит.
- kind: tip
  picture: bulb
  text: Почему так? Через точку путь по одной линии приходит, по другой уходит. Линии собираются в пары. Без пары остаются только линии в начале и в конце.
- kind: try
  text: Можно ли обвести квадрат, не отрывая карандаша?
  answer: Да. В каждом углу сходятся 2 линии, так что точек с нечётным числом линий нет. Начинай с любого угла.
