kind: theory
status: active
learning:
  title: Скобки и буквы-загадки
  subject: math
blocks:
- kind: says
  text: У примеров есть свой порядок действий. А в ребусах цифры прячутся за буквами!
- kind: facts
  items:
  - picture: brackets
    title: Скобки — первыми
    text: Сначала выполни действие внутри скобок.
  - picture: arrow
    title: Слева направо
    text: Так считай, когда скобок нет, а есть только сложение и вычитание.
  - picture: letter
    title: Буква — это цифра
    text: Одинаковые буквы заменяют одинаковые цифры, разные — разные.
  - picture: check
    title: Проверь ребус
    text: Подставь найденную цифру и проверь равенство.
- kind: try
  text: 7 − (1 + 2) и 7 − 1 + 2. Одинаковые ли ответы?
  answer: Нет. 7 − (1 + 2) = 4, а 7 − 1 + 2 = 8.
