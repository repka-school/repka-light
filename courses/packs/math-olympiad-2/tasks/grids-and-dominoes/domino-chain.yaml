status: active
difficulty: easy
question:
  text: |
    Есть костяшки 1–2, 2–3 и 3–1. Цепочка начинается с числа 1 и костяшки 1–2. Используй все костяшки, соединяя одинаковые числа. Каким числом закончится цепочка?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "1"
      correct: true
    - id: 2
      text: "0"
    - id: 3
      text: "2"
    - id: 4
      text: "3"
    - id: 5
      text: "4"
points: 1
classification:
- subject: math
  concept: graphs
learning:
  hint:
    text: >-
      Прикладывай костяшки по одной: к свободному концу подходит только костяшка с тем же числом. Посмотри, какое число окажется на свободном конце, когда костяшки закончатся.
explanation:
  text: |
    После 1–2 положи 2–3, затем 3–1. Цепочка: 1–2 | 2–3 | 3–1. На свободном конце останется 1.
