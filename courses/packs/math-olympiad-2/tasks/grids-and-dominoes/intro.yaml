kind: theory
status: active
learning:
  title: Никаких повторов!
  subject: math
blocks:
- kind: says
  text: 'В судоку у каждого числа своё место. Главное правило: никаких повторов!'
- kind: facts
  items:
  - picture: sudoku
    title: Судоку 4 на 4
    text: Числа 1, 2, 3, 4 стоят по одному в каждом ряду, столбце и маленьком квадрате 2 на 2.
  - picture: table
    title: Судоку 6 на 6
    text: Числа от 1 до 6 стоят по одному в ряду, столбце и выделенном прямоугольнике 2 на 3.
  - picture: cells
    title: Клетки с суммой
    text: В головоломке бывают условия на сумму соседних клеток. Проверяй и сумму, и повторы в строках.
  - picture: domino
    title: Домино
    text: У костяшки две половинки. В цепочке соприкасаются одинаковые числа. Поворот костяшки не делает её новой.
- kind: try
  text: В ряду судоку 4 на 4 уже стоят числа 1, 2 и 4. Какое число пропущено?
  answer: 3. В ряду должны быть все числа от 1 до 4 по одному разу.
