status: active
difficulty: medium
question:
  text: |
    На каждой половинке костяшки можно поставить 0, 1 или 2 точки. Костяшки 1–2 и 2–1 считаются одной. Сколько разных костяшек получится?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "4"
    - id: 2
      text: "5"
    - id: 3
      text: "7"
    - id: 4
      text: "8"
    - id: 5
      text: "6"
      correct: true
points: 2
classification:
- subject: math
  concept: counting
learning:
  hint:
    text: >-
      Перебирай по порядку: сначала все костяшки с нулём, потом с единицей, которых ещё не было, потом с двойкой. Костяшки вроде 1–2 и 2–1 считай один раз.
explanation:
  text: |
    Начни с нуля: 0–0, 0–1, 0–2. Затем с единицы: 1–1, 1–2; костяшку 1–0 уже считали. Осталась 2–2. Всего 6 костяшек.
