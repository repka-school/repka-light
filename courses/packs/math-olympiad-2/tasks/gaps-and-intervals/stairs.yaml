status: active
difficulty: medium
question:
  text: |
    Между соседними этажами одинаковое число ступенек. С первого на третий этаж ведут 20 ступенек. Сколько ступенек с первого на пятый?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "20"
    - id: 2
      text: "25"
    - id: 3
      text: "40"
      correct: true
    - id: 4
      text: "30"
    - id: 5
      text: "50"
points: 2
classification:
- subject: math
  concept: objects-and-gaps
learning:
  hint:
    text: >-
      Ступеньки идут не на этажах, а между этажами. Посчитай, сколько промежутков между этажами с первого на третий и сколько ступенек приходится на один промежуток.
explanation:
  text: |
    С первого на третий — два промежутка между этажами. Значит, на один приходится 10 ступенек. С первого на пятый таких промежутков четыре: 10 + 10 + 10 + 10 = 40.
