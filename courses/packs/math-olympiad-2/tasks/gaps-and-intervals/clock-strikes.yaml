status: active
difficulty: hard
question:
  text: |
    Часы сделали 4 удара. От первого до последнего прошло 6 секунд. Паузы одинаковые, сами удары считаем мгновенными. Сколько секунд пройдёт от первого до последнего из 6 ударов?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "8"
    - id: 2
      text: "9"
    - id: 3
      text: "11"
    - id: 4
      text: "10"
      correct: true
    - id: 5
      text: "12"
points: 3
classification:
- subject: math
  concept: objects-and-gaps
learning:
  hint:
    text: >-
      Время уходит не на удары, а на паузы между ними. Нарисуй удары точками в ряд, посчитай паузы между ними и узнай, сколько длится одна пауза.
explanation:
  text: |
    У четырёх ударов три паузы. В каждой по 2 секунды: 2 + 2 + 2 = 6. У шести ударов пять пауз: 2 + 2 + 2 + 2 + 2 = 10 секунд.
