kind: theory
status: active
learning:
  title: Важен ли порядок?
  subject: math
blocks:
- kind: says
  text: Иногда порядок важен, а иногда нет. От этого зависит ответ!
- kind: facts
  items:
  - picture: pattern
    title: В ряду порядок важен
    text: Кот перед зайцем и заяц перед котом — разные ряды.
  - picture: pair
    title: В паре порядок не важен
    text: Аня с Борей — та же пара, что Боря с Аней.
- kind: tip
  picture: list
  text: Записывай пары так, чтобы не посчитать одну дважды.
- kind: try
  text: Трое друзей пожали друг другу руки. Каждая пара — один раз. Сколько было рукопожатий?
  answer: '3. Запиши пары: первый со вторым, первый с третьим, второй с третьим.'
