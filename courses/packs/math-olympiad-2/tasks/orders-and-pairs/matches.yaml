learning:
  hint:
    text: >-
      Посчитай матчи первого игрока. Потом для второго считай только новые матчи, которые ещё не посчитаны, и так дальше до последнего игрока.
explanation:
  text: |
    У первого игрока 4 встречи. У второго остаются 3 новые, у третьего — 2, у четвёртого — 1. Всего 4 + 3 + 2 + 1 = 10 матчей.
