status: active
difficulty: easy
question:
  text: |
    В ящике 5 красных и 5 синих носков. Сколько носков нужно взять не глядя, чтобы наверняка получить два одного цвета?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "1"
    - id: 2
      text: "3"
      correct: true
    - id: 3
      text: "2"
    - id: 4
      text: "4"
    - id: 5
      text: "5"
points: 1
classification:
- subject: math
  concept: worst-case
learning:
  hint:
    text: >-
      Представь самый неудачный случай: сколько носков можно взять так, чтобы двух одного цвета среди них ещё не было? Что тогда сделает следующий носок?
explanation:
  text: |
    Первые два могут оказаться разного цвета. Третий будет красным или синим и составит пару с одним из них. Двух носков для гарантии недостаточно.
