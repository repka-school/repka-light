kind: theory
status: active
learning:
  title: А если не повезёт?
  subject: math
blocks:
- kind: says
  text: 'Слово «наверняка» значит: получится, даже если совсем не повезёт.'
- kind: steps
  items:
  - picture: bag
    title: Представь невезение
    text: Сначала попадаются все предметы, которые тебе не помогают.
  - picture: counters
    title: Сосчитай их
    text: И подумай, сколько нужно взять ещё.
  - picture: check
    title: Проверь
    text: Возьми на один предмет меньше. Можно ли остаться без нужного?
- kind: try
  text: В коробке 2 синих карандаша и 1 красный. Ты берёшь не глядя. Сколько карандашей нужно взять, чтобы наверняка достать красный?
  answer: 3. Если не повезёт, сначала попадутся оба синих.
