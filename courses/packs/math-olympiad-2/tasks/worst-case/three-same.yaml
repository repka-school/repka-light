status: active
difficulty: hard
question:
  text: |
    В коробке 4 красных и 4 синих карандаша. Сколько нужно взять не глядя, чтобы наверняка получить 3 карандаша одного цвета?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "3"
    - id: 2
      text: "4"
    - id: 3
      text: "6"
    - id: 4
      text: "7"
    - id: 5
      text: "5"
      correct: true
points: 3
classification:
- subject: math
  concept: worst-case
learning:
  hint:
    text: >-
      Представь самый неудачный случай: сколько карандашей можно взять так, чтобы ни одного цвета не набралось трёх? Сколько тогда в руке каждого цвета?
explanation:
  text: |
    Среди четырёх карандашей могут быть 2 красных и 2 синих — тройки нет. Пятый увеличит одну из этих групп до трёх. Значит, 5 достаточно, а 4 ещё нет.
