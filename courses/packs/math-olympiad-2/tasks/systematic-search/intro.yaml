kind: theory
status: active
learning:
  title: Ничего не пропусти!
  subject: math
blocks:
- kind: says
  text: Вариантов много, и один легко потерять. Перебирай по порядку, тогда найдёшь все.
- kind: steps
  items:
  - picture: list
    title: Выбери первый шаг
    text: И выпиши все его продолжения.
  - picture: swap
    title: Поменяй первый шаг
    text: Снова выпиши все продолжения.
  - picture: check
    title: Проверь
    text: Ни один вариант не повторился и не потерялся?
- kind: tip
  picture: tree
  text: 'Удобно рисовать дерево: от первого выбора идут веточки ко второму.'
- kind: try
  text: Есть 2 шапки и 2 шарфа. Сколько разных пар «шапка и шарф» можно составить?
  answer: 4. С первой шапкой 2 шарфа, со второй ещё 2.
