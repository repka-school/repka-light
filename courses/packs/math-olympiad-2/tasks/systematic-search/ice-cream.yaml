status: active
difficulty: easy
question:
  text: |
    Есть ванильное, шоколадное и клубничное мороженое. К одной порции выбирают одну добавку: орехи или изюм. Сколько разных сочетаний можно заказать?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "6"
      correct: true
    - id: 2
      text: "4"
    - id: 3
      text: "5"
    - id: 4
      text: "7"
    - id: 5
      text: "8"
points: 1
classification:
- subject: math
  concept: counting
learning:
  hint:
    text: >-
      Возьми один вкус и выпиши к нему все добавки, потом сделай то же для каждого следующего вкуса.
explanation:
  text: |
    Для каждого вкуса есть два выбора добавки. Выпиши: ваниль с орехами или изюмом, шоколад с орехами или изюмом, клубника с орехами или изюмом. Всего 2 + 2 + 2 = 6.
