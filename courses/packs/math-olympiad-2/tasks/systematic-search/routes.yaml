status: active
difficulty: medium
question:
  text: |
    Из дома в парк ведут 2 дорожки, а из парка к озеру — 3. Ты идёшь из дома через парк к озеру, выбирая по одной дорожке на каждом участке. Сколько разных маршрутов?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "4"
    - id: 2
      text: "6"
      correct: true
    - id: 3
      text: "5"
    - id: 4
      text: "7"
    - id: 5
      text: "8"
points: 2
classification:
- subject: math
  concept: counting
learning:
  hint:
    text: >-
      Выбери сначала одну дорожку до парка и посчитай, сколькими способами можно идти дальше. Потом повтори для другой дорожки.
explanation:
  text: |
    Если выбрать первую дорожку до парка, дальше есть 3 пути. Если вторую — ещё 3. Всего 3 + 3 = 6 маршрутов. Маршруты различаются хотя бы одной дорожкой.
