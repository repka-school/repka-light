status: active
difficulty: hard
question:
  text: |
    В игре 9 камней. За ход берут 1 или 2, последний камень приносит победу. Кто может обеспечить себе победу?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: Первый игрок
    - id: 2
      text: Оба одновременно
    - id: 3
      text: Второй игрок
      correct: true
    - id: 4
      text: 'Никто: всегда ничья'
    - id: 5
      text: Первый, если сразу возьмёт 2
points: 3
classification:
- subject: math
  concept: games-strategies
learning:
  hint:
    text: >-
      Попробуй отвечать на каждый ход соперника так, чтобы за пару ходов всегда уходило одно и то же число камней. Делится ли число камней на это число и кому тогда достанется последний?
explanation:
  text: |
    Второй дополняет каждый ход первого до трёх: берёт 2 после 1 или 1 после 2. После пар ходов остаётся 6, затем 3, затем 0. Последний ход делает второй.
