status: active
difficulty: easy
question:
  text: |
    В узоре 3 точки слева от зеркальной линии. Ни одной точки на самой линии нет. Справа нужно нарисовать их зеркальные пары. Сколько точек будет в полном узоре?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "4"
    - id: 2
      text: "5"
    - id: 3
      text: "7"
    - id: 4
      text: "8"
    - id: 5
      text: "6"
      correct: true
points: 1
classification:
- subject: math
  concept: symmetry
learning:
  hint:
    text: >-
      Подумай, сколько отражённых точек появится справа у каждой левой точки. Не забудь, что левые точки тоже остаются в узоре.
explanation:
  text: |
    У каждой из трёх левых точек появится отдельная правая пара. Всего 3 + 3 = 6. Точки на линии не пришлось учитывать, потому что их нет.
