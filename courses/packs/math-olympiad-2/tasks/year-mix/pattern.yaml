question:
  text: |
    Начни с 2 и каждый раз прибавляй на 1 больше: сначала 1, потом 2, потом 3. Получились 2, 3, 5, 8. Какое число следующее?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "10"
    - id: 2
      text: "11"
    - id: 3
      text: "12"
      correct: true
    - id: 4
      text: "13"
    - id: 5
      text: "14"
points: 2
classification:
- subject: math
  concept: patterns
learning:
  hint:
    text: >-
      Найди, сколько прибавили на последнем шаге ряда, чтобы из 5 получить 8. Следующий шаг по правилу будет на единицу больше.
explanation:
  text: |
    Последнее прибавление было 3. Теперь прибавь 4: 8 + 4 = 12.
