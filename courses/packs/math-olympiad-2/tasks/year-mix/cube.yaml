question:
  text: |
    На рисунке развёртка куба. Какая грань будет напротив грани 1?
  images:
    - file: images/cube-net.png
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "2"
    - id: 2
      text: "4"
    - id: 3
      text: "5"
    - id: 4
      text: "3"
      correct: true
    - id: 5
      text: "6"
points: 2
classification:
- subject: math
  concept: spatial-reasoning
learning:
  hint:
    text: >-
      Мысленно сложи развёртку, положив грань 2 на стол дном: соседние с ней грани поднимутся стенками. Посмотри, какая стенка окажется с другой стороны от стенки 1.
explanation:
  text: |
    Грани 1 и 3 находятся с двух противоположных сторон от грани 2. При складывании они станут противоположными стенками куба.
