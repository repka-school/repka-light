kind: theory
status: active
learning:
  title: Что будет дальше?
  subject: math
blocks:
- kind: says
  text: В каждом ряду спрятано правило. Найди его и узнаешь, что будет дальше!
- kind: steps
  items:
  - picture: magnifier
    title: Смотри, что меняется
    text: От одного числа или предмета к следующему.
  - picture: bulb
    title: Предложи правило
    text: 'Например: «каждый раз на 2 больше».'
  - picture: check
    title: Проверь на каждом шаге
    text: Правило должно подходить везде.
- kind: tip
  picture: pattern
  text: 'Предметы повторяются? Выдели один повтор: круг, квадрат — и снова круг, квадрат. Тогда узор можно продолжить, не начиная счёт заново.'
- kind: try
  text: 1, 3, 5, 7… Какое число следующее?
  answer: 9. Каждый раз прибавляем 2.
