status: active
difficulty: medium
question:
  text: |
    Узор должен повторяться: круг, треугольник, квадрат. Получилась строка: круг, треугольник, квадрат, круг, квадрат, квадрат. Что нужно исправить?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: Четвёртую фигуру заменить квадратом
    - id: 2
      text: Первую фигуру заменить треугольником
    - id: 3
      text: Третью фигуру заменить кругом
    - id: 4
      text: Шестую фигуру заменить треугольником
    - id: 5
      text: Пятую фигуру заменить треугольником
      correct: true
points: 2
classification:
- subject: math
  concept: patterns
learning:
  hint:
    text: >-
      Раздели строку на тройки по порядку и сравни каждую тройку с образцом фигура за фигурой.
explanation:
  text: |
    Первые три фигуры образуют верный повтор. Второй повтор должен быть таким же: круг, треугольник, квадрат. В нём неверна средняя фигура — пятая во всей строке.
