status: active
difficulty: medium
question:
  text: |
    Прямоугольник 3 на 4 клетки нужно разрезать на три равные полоски 1 на 4 клетки. Бумагу нельзя складывать или перекладывать части. Сколько прямых разрезов нужно?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "0"
    - id: 2
      text: "1"
    - id: 3
      text: "3"
    - id: 4
      text: "4"
    - id: 5
      text: "2"
      correct: true
points: 2
classification:
- subject: math
  concept: grid-geometry
learning:
  hint:
    text: >-
      Подумай, на сколько частей делит бумагу один прямой разрез. Где провести разрезы, чтобы отделить каждый ряд?
explanation:
  text: |
    Проведи разрезы между первым и вторым рядами и между вторым и третьим. Получатся три полоски. Одним прямым разрезом цельный прямоугольник можно разделить только на две части.
