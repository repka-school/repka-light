status: active
difficulty: medium
question:
  text: |
    У двух фигур по 4 одинаковые клетки. Одна фигура — квадрат 2 на 2, другая — полоска 1 на 4. Что верно?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: Фигуры обязательно совпадут
    - id: 2
      text: У полоски клеток больше
    - id: 3
      text: Клеток поровну, но при наложении фигуры не совпадут
      correct: true
    - id: 4
      text: У квадрата клеток больше
    - id: 5
      text: Нельзя сосчитать клетки без ножниц
points: 2
classification:
- subject: math
  concept: grid-geometry
learning:
  hint:
    text: >-
      Сравни отдельно две вещи: число клеток в фигурах и их форму. Можно ли поворотом сделать из одной фигуры другую?
explanation:
  text: |
    Обе фигуры состоят из четырёх клеток. Но у квадрата два ряда, а у полоски один длинный ряд. При повороте полоска всё равно не станет квадратом.
