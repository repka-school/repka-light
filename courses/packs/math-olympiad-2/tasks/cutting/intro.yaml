kind: theory
status: active
learning:
  title: Равные, как близнецы
  subject: math
blocks:
- kind: says
  text: Равные части — как близнецы. Положи одну на другую, и они совпадут.
- kind: facts
  items:
  - picture: equal
    title: Равные части совпадают
    text: 'Проверяй наложением: и размер, и форму.'
  - picture: shapes
    title: Клеток поровну — ещё не всё
    text: Форма тоже должна быть одинаковой.
  - picture: pencil
    title: Наметь разрез карандашом
    text: После разрезания проверь части ещё раз.
- kind: tip
  picture: scissors
  text: Режешь бумагу ножницами? Попроси взрослого помочь.
- kind: try
  text: Квадрат 2 на 2 клетки разрезали пополам по линии клеток. Какие части получились?
  answer: Две одинаковые полоски по 2 клетки.
