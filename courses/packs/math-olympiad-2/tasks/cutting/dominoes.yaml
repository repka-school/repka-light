status: active
difficulty: medium
question:
  text: |
    Из квадрата 3 на 3 клетки вырезали одну угловую клетку. Остаток разрезали на части по 2 соседние клетки. Сколько частей получилось?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "2"
    - id: 2
      text: "3"
    - id: 3
      text: "5"
    - id: 4
      text: "4"
      correct: true
    - id: 5
      text: "6"
points: 2
classification:
- subject: math
  concept: grid-geometry
learning:
  hint:
    text: >-
      Сначала сосчитай, сколько клеток осталось после вырезания, а потом подумай, сколько частей по две клетки из них получится.
explanation:
  text: |
    В квадрате было 9 клеток, после удаления осталось 8. Их можно собрать в 4 пары: 2 + 2 + 2 + 2 = 8. Например, две оставшиеся клетки верхнего ряда составят одну часть, а два полных нижних ряда — ещё три вертикальные части.
