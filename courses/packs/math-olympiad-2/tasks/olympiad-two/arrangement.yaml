status: active
difficulty: medium
question:
  text: |
    В верхнем ряду таблицы стоят 4 и неизвестное число, в нижнем — 6 и 3. Суммы рядов равны. Какое число пропущено?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: "3"
    - id: 2
      text: "5"
      correct: true
    - id: 3
      text: "4"
    - id: 4
      text: "6"
    - id: 5
      text: "7"
points: 2
classification:
- subject: math
  concept: magic-squares
learning:
  hint:
    text: >-
      Найди сумму того ряда, где известны оба числа. В другом ряду должно получиться столько же: подумай, что нужно добавить к числу, которое там уже стоит.
explanation:
  text: |
    Сумма нижнего ряда 6 + 3 = 9. Чтобы сверху тоже было 9, к 4 нужно добавить 5.
