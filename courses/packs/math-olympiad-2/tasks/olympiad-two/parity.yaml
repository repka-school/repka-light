status: active
difficulty: medium
question:
  text: |
    Можно ли получить 14, сложив три нечётных числа?
answer:
  kind: single
  hide: true
  options:
    - id: 1
      text: 'Да: 3 + 5 + 6'
    - id: 2
      text: 'Да: 1 + 5 + 8'
    - id: 3
      text: 'Нет: сумма трёх нечётных чисел нечётная'
      correct: true
    - id: 4
      text: 'Да: 1 + 3 + 10'
    - id: 5
      text: 'Нет: три числа всегда меньше 14'
points: 2
classification:
- subject: math
  concept: parity
learning:
  hint:
    text: >-
      Разложи каждое нечётное число на пары: у каждого останется один предмет. Подумай, сколько одиночек наберётся у трёх чисел и смогут ли они все собраться в пары.
explanation:
  text: |
    У трёх нечётных чисел вместе остаётся один предмет без пары, поэтому сумма нечётная. Число 14 чётное, значит, получить его нельзя.
