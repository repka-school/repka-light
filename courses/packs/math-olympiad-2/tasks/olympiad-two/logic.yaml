status: active
difficulty: hard
question:
  text: |
    У Олега, Пети и Ромы по одному разному значку: со звездой, с луной или с солнцем. У Олега не луна и не солнце. У Пети не солнце. Какой значок у Ромы?
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: Со звездой
    - id: 2
      text: С луной
    - id: 3
      text: С облаком
    - id: 4
      text: С солнцем
      correct: true
    - id: 5
      text: Определить нельзя
points: 3
classification:
- subject: math
  concept: logic-tables
learning:
  hint:
    text: >-
      Начни с мальчика, про которого сказано больше всего: у него остаётся только один значок. Потом вычеркни этот значок у остальных и посмотри, что осталось.
explanation:
  text: |
    Олегу остаётся звезда. Пете нельзя солнце, а звезда уже занята: значит, у него луна. Роме остаётся солнце.
