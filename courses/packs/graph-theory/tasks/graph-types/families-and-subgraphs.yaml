    <p>Как соединить три площадки A, B и C, чтобы между любыми двумя была прямая тропинка? Проведи рёбра AB, AC и BC. На левом рисунке есть все три пары.</p>
    <p><img src="images/families-comparison.png" alt="Слева вершины A, B и C с рёбрами AB, AC и BC. Справа два ряда вершин, K и L в одном ряду, M, N и P в другом. Рёбра KM, KN, KP, LM, LN и LP."></p>
    <blockquote><p><strong>Полный граф</strong> — граф, в котором любые две разные вершины соединены ребром.</p></blockquote>
    <p>Например, треугольник слева — полный граф на трёх вершинах, так как все три пары соединены. В полном графе на четырёх вершинах у каждой по три соседа. Каждое ребро учтено у обоих концов, поэтому всего 4 · 3 : 2 = 6 рёбер.</p>
    <p>На правом рисунке дорожки идут между двумя рядами площадок. В левом ряду K и L, в правом M, N и P. Площадки одного ряда не соседствуют.</p>
    <blockquote><p>Граф <strong>двудольный</strong>, если его вершины можно разделить на две группы, или доли, так, чтобы у каждого ребра концы лежали в разных долях.</p></blockquote>
    <p>Например, правый граф двудольный, так как у каждого ребра один конец в {K, L}, а другой в {M, N, P}. Если убрать ребро LP, это же разбиение всё ещё годится.</p>
    <blockquote><p><strong>Полный двудольный граф</strong> — двудольный граф, в котором каждая вершина одной доли соединена с каждой вершиной другой доли.</p></blockquote>
    <p>Например, правый граф полный двудольный. У каждой из двух левых вершин по три ребра вправо. Считая их по левым концам, получаем 2 · 3 = 6 рёбер. Если убрать LP, между L и P не будет ребра, поэтому это разбиение уже не даст полный двудольный граф.</p>
    <blockquote><p><strong>✓</strong> В полном двудольном графе число рёбер равно произведению размеров долей.</p></blockquote>
    <blockquote><p><strong>!</strong> В двудольном графе треугольник невозможен. При разбиении трёх его вершин на две доли в одной доле окажутся хотя бы две вершины. Они соединены ребром, а ребро внутри доли запрещено.</p></blockquote>
