question:
  text: |-
    Можно ли взять из графа на схеме вершины A, B и C и оставить всего два ребра AB и BC? Да, все три вершины уже есть, а у обоих рёбер концы среди них.

    У подграфа выбирают вершины и рёбра исходного графа. У каждого выбранного ребра оба конца должны быть среди выбранных вершин.

    Например, вершины A, B и C с рёбрами AB и BC образуют подграф. Ребро AC было в исходном графе, но в этот подграф его не взяли.

    Подграф, порождённый выбранными вершинами, состоит из этих вершин и всех рёбер исходного графа между ними.

    Например, подграф на A, B и C с рёбрами AB, AC и BC порождён этими вершинами, так как в нём сохранились все рёбра между ними.

    Как построить порождённый подграф?
    1) Оставь только выбранные вершины.
    2) Убери каждое ребро, у которого хотя бы один конец удалён. Остальные рёбра сохрани.

    Пример по той же схеме.
    1) Выберем A, C и D, поэтому уберём B.
    2) Уберём AB и BC, так как у обоих есть конец B. Останутся AC и CD.
