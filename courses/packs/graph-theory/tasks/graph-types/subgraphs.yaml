    <p>Можно ли взять из графа на схеме вершины A, B и C и оставить всего два ребра AB и BC? Да, все три вершины уже есть, а у обоих рёбер концы среди них.</p>
    <p><img src="images/subgraph-example.png" alt="Вершины A, B и C соединены рёбрами AB, AC и BC. Вершина D соединена только с C ребром CD."></p>
    <blockquote><p>У <strong>подграфа</strong> выбирают вершины и рёбра исходного графа. У каждого выбранного ребра оба конца должны быть среди выбранных вершин.</p></blockquote>
    <p>Например, вершины A, B и C с рёбрами AB и BC образуют подграф. Ребро AC было в исходном графе, но в этот подграф его не взяли.</p>
    <blockquote><p><strong>Подграф, порождённый выбранными вершинами</strong>, состоит из этих вершин и всех рёбер исходного графа между ними.</p></blockquote>
    <p>Например, подграф на A, B и C с рёбрами AB, AC и BC порождён этими вершинами, так как в нём сохранились все рёбра между ними.</p>
    <p>Как построить порождённый подграф?</p>
    <ol>
      <li>Оставь только выбранные вершины.</li>
      <li>Убери каждое ребро, у которого хотя бы один конец удалён. Остальные рёбра сохрани.</li>
    </ol>
    <p>Пример по той же схеме.</p>
    <ol>
      <li>Выберем A, C и D, поэтому уберём B.</li>
      <li>Уберём AB и BC, так как у обоих есть конец B. Останутся AC и CD.</li>
    </ol>
