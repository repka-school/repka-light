question:
  text: |-
    Как добраться от A до E на рисунке, не заходя дважды в одну вершину? Можно пройти A–B–E. По ребру AB ты попадёшь в B, а по ребру BE — в E. Всего пройдёшь два ребра.

    Путь — последовательность разных вершин, в которой каждые две подряд соединены ребром. Длина пути — число пройденных рёбер.

    Например, A–D–C–B–E — путь длины 4, так как в нём четыре ребра DA, CD, BC и BE. В нём пять вершин.

    ! Длину пути считай по рёбрам. У пути с пятью вершинами четыре перехода.

    Кратчайший путь между двумя вершинами — путь наименьшей длины.

    Например, путь A–B–E кратчайший, так как в нём два ребра, а прямого ребра AE нет.

    Как вернуться в A, посетив по дороге B, C и D по одному разу? Иди A–B–C–D–A по рёбрам AB, BC, CD и DA.

    Цикл — последовательность вершин, в которой каждые две подряд соединены ребром, первая и последняя вершины совпадают, а других повторений нет. В простом графе цикл содержит не менее трёх рёбер.

    Например, A–B–C–D–A — цикл длины 4, так как он замыкается через DA и повторяет только A. Обход A–B–A не образует цикл, потому что ребро AB пройдено туда и обратно.

    Граф связный, если между любыми двумя разными вершинами есть путь.

    Например, граф на рисунке связный. Из любой вершины четырёхугольника можно по его сторонам дойти до любой другой. Из E сначала можно попасть в B и оттуда дойти по сторонам четырёхугольника до нужной вершины.

    ✓ Чтобы доказать, что граф несвязный, достаточно найти две вершины, между которыми нет пути.
  html: |-
    <p>Как добраться от A до E на рисунке, не заходя дважды в одну вершину? Можно пройти A–B–E. По ребру AB ты попадёшь в B, а по ребру BE — в E. Всего пройдёшь два ребра.</p>
    <p><img src="images/paths-cycles.png" alt="Вершины A, B, C и D образуют четырёхугольник с рёбрами AB, BC, CD и DA. Вершина E соединена только с B."></p>
    <blockquote><p><strong>Путь</strong> — последовательность разных вершин, в которой каждые две подряд соединены ребром. <strong>Длина пути</strong> — число пройденных рёбер.</p></blockquote>
    <p>Например, A–D–C–B–E — путь длины 4, так как в нём четыре ребра DA, CD, BC и BE. В нём пять вершин.</p>
    <blockquote><p><strong>!</strong> Длину пути считай по рёбрам. У пути с пятью вершинами четыре перехода.</p></blockquote>
    <blockquote><p><strong>Кратчайший путь</strong> между двумя вершинами — путь наименьшей длины.</p></blockquote>
    <p>Например, путь A–B–E кратчайший, так как в нём два ребра, а прямого ребра AE нет.</p>
    <p>Как вернуться в A, посетив по дороге B, C и D по одному разу? Иди A–B–C–D–A по рёбрам AB, BC, CD и DA.</p>
    <blockquote><p><strong>Цикл</strong> — последовательность вершин, в которой каждые две подряд соединены ребром, первая и последняя вершины совпадают, а других повторений нет. В простом графе цикл содержит не менее трёх рёбер.</p></blockquote>
    <p>Например, A–B–C–D–A — цикл длины 4, так как он замыкается через DA и повторяет только A. Обход A–B–A не образует цикл, потому что ребро AB пройдено туда и обратно.</p>
    <blockquote><p>Граф <strong>связный</strong>, если между любыми двумя разными вершинами есть путь.</p></blockquote>
    <p>Например, граф на рисунке связный. Из любой вершины четырёхугольника можно по его сторонам дойти до любой другой. Из E сначала можно попасть в B и оттуда дойти по сторонам четырёхугольника до нужной вершины.</p>
    <blockquote><p><strong>✓</strong> Чтобы доказать, что граф несвязный, достаточно найти две вершины, между которыми нет пути.</p></blockquote>
