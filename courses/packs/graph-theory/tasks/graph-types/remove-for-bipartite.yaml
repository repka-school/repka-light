  hint:
    text: >-
      Найди треугольники. Проверь, может ли удаление одного ребра разрушить сразу каждый из них.
explanation:
  text: |
    В двудольном графе не может быть треугольника. При любом разбиении трёх его вершин на две доли две соседние вершины окажутся в одной доле.

    На рисунке есть треугольники ABC и CDE, поэтому в каждом нужно удалить хотя бы одно ребро.

    У треугольников общая вершина C, а общих рёбер нет. Если удалить только одно ребро, хотя бы один треугольник останется целиком.

    Удалим AB и DE. Можно взять доли {C, F} и {A, B, D, E}, потому что каждое из оставшихся рёбер AC, BC, CD, CE и EF соединяет вершины из разных долей.

    Ответ: Б. Нужно удалить 2 ребра.
note: >-
  Авторское задание и рисунок Repka по § 2.1. Вариант 1 не учитывает, что треугольники не имеют общих рёбер. Варианты 3, 4 и 5 возможны при лишних удалениях, но не дают минимума.
