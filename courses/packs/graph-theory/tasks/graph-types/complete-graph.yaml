status: active
question:
  text: |
    Сколько рёбер нужно добавить, чтобы граф стал полным?
  html: |
    <p>Сколько рёбер нужно добавить, чтобы граф стал полным?</p>
    <p><img src="images/complete-graph.png" alt="Вершины A, B, C, D и E. Рёбра AB, BC, CD, DE, EA, AC и BD."></p>
  images:
