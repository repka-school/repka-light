learning:
  theory:
    - graph-theory:graph-types:families-and-subgraphs
  hint:
    text: >-
      Посчитай, сколько всего пар вершин можно соединить. Сравни это число с количеством рёбер на рисунке.
explanation:
  text: |
    В полном графе каждой вершине нужны рёбра ко всем остальным. Здесь у каждой из пяти вершин должно быть по четыре соседа.

    Каждое ребро учитывается у обоих концов, поэтому в полном графе будет 5 · 4 : 2 = 10 рёбер.

    На рисунке пять сторон пятиугольника и две диагонали. Значит, сейчас рёбер 5 + 2 = 7.

    Ответ: Г. Нужно добавить 10 − 7 = 3 ребра.

    Проверка: на рисунке не соединены пары A и D, B и E, C и E. После добавления AD, BE и CE соединены все пары.
