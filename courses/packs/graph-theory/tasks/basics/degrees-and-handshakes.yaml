question:
  text: |-
    На схеме остановок найди все рёбра с концом в A. Это два ребра — AB и AC.

    Степень вершины — число рёбер, у которых она служит концом. Например, у A степень 2, так как у рёбер AB и AC один конец в A. У B и C степени 1, у D степень 0.

    Вершину степени 0 называют изолированной.

    ✓ По лемме о рукопожатиях сумма степеней равна удвоенному числу рёбер.

    Каждое ребро прибавляет единицу к степени каждой из двух вершин на его концах. Поэтому сумма степеней всегда чётна.

    Как найти число рёбер по степеням?
    1) Сложи степени всех вершин.
    2) Раздели сумму на 2.

    Пример со схемой остановок.
    1) Складываем степени. Получаем 2 + 1 + 1 + 0 = 4.
    2) Делим сумму на 2. Получаем 4 : 2 = 2 ребра.
