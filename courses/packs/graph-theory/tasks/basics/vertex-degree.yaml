status: active
question:
  text: |
    В графе пять вершин A, B, C, D и E. Его рёбра — AB, AC, BC, BD и BE. Какова степень вершины B?
answer:
  kind: single
  hide: true
  options:
    - id: 1
      text: >-
        2
    - id: 2
      text: >-
        3
    - id: 3
      text: >-
        5
    - id: 4
      text: >-
        8
    - id: 5
      text: >-
        4
      correct: true
points: 1
difficulty: easy
classification:
  - subject: math
    concept: graphs
learning:
  theory:
    - graph-theory:basics:degrees-and-handshakes
  hint:
    text: >-
      Проверь обе буквы в записи каждого ребра.
explanation:
  text: |
    Степень вершины равна числу рёбер с концом в этой вершине. Поэтому ищем рёбра, в записи которых есть буква B.

    Буква B стоит в записях AB, BC, BD и BE. Каждое из этих рёбер прибавляет к степени B единицу.

    Ответ: Д. 4.

    Проверка: у B четыре соседа — A, C, D и E. В простом графе каждому соседу соответствует одно ребро, поэтому степень B равна числу её соседей.
