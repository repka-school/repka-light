question:
  text: |-
    Представь четыре остановки A, B, C и D. Между A и B, а также между A и C есть прямые маршруты в обе стороны. Как изобразить эту сеть? Поставь по точке для каждой остановки и соедини точки A и B, а также A и C.

    Простой неориентированный граф состоит из вершин и рёбер. Каждое ребро соединяет две разные вершины. Между любой парой вершин не более одного ребра. Рёбра не имеют направления.

    Например, точки на схеме обозначают вершины, а линии обозначают рёбра. Обозначения AB и BA относятся к одному ребру, так как оно соединяет те же две вершины.

    ! Пересечение линий без точки не образует вершину.

    Вершины называют соседними, если их соединяет ребро. Например, A и B соседние, так как есть ребро AB.

    Один и тот же граф можно задать рисунком, списком рёбер или списком соседей каждой вершины. На рисунке рёбра AB и AC. У A два соседа — B и C. У B и C по одному соседу — A. У D соседей нет.
  html: |-
    <p>Представь четыре остановки A, B, C и D. Между A и B, а также между A и C есть прямые маршруты в обе стороны. Как изобразить эту сеть? Поставь по точке для каждой остановки и соедини точки A и B, а также A и C.</p>
    <p><img src="images/vertices-and-edges.png" alt="A соединена с B и C. Точка D стоит отдельно."></p>
    <blockquote><p><strong>Простой неориентированный граф</strong> состоит из вершин и рёбер. Каждое ребро соединяет две разные вершины. Между любой парой вершин не более одного ребра. Рёбра не имеют направления.</p></blockquote>
    <p>Например, точки на схеме обозначают вершины, а линии обозначают рёбра. Обозначения AB и BA относятся к одному ребру, так как оно соединяет те же две вершины.</p>
    <blockquote><p><strong>!</strong> Пересечение линий без точки не образует вершину.</p></blockquote>
    <blockquote><p>Вершины называют <strong>соседними</strong>, если их соединяет ребро.</p></blockquote>
    <p>Например, A и B соседние, так как есть ребро AB.</p>
    <p>Один и тот же граф можно задать рисунком, списком рёбер или списком соседей каждой вершины. На рисунке рёбра AB и AC. У A два соседа — B и C. У B и C по одному соседу — A. У D соседей нет.</p>
