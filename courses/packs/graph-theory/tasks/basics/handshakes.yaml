status: active
question:
  text: |
    В кружке семь ребят. Любые двое могли пожать друг другу руки не более одного раза. Лена говорит, что каждый пожал руки ровно троим. Что доказывает, что Лена ошиблась?
answer:
  kind: single
  hide: true
  options:
    - id: 1
      text: >-
        Одинаковые степени возможны только при чётном числе вершин.
    - id: 2
      text: >-
        Число рукопожатий должно быть чётным.
    - id: 3
      text: >-
        Сумма степеней была бы нечётной, хотя каждое ребро добавляет к ней два.
      correct: true
    - id: 4
      text: >-
        Каждый мог пожать руку только одному человеку.
    - id: 5
      text: >-
        В графе с семью вершинами не больше семи рёбер.
points: 3
difficulty: hard
classification:
  - subject: math
    concept: graphs
learning:
  theory:
    - graph-theory:basics:degrees-and-handshakes
  hint:
    text: >-
      Представь ребят вершинами графа, а рукопожатия — рёбрами. Какое свойство суммы степеней может помочь?
explanation:
  text: |
    Обозначь каждого участника вершиной и проведи ребро за каждое рукопожатие. Тогда степень вершины показывает, скольким людям участник пожал руку.

    По рассказу Лены степень каждой из семи вершин равна 3, поэтому сумма степеней равна 7 · 3 = 21.

    Каждое рукопожатие учитывается у двух участников, поэтому сумма степеней должна быть чётной.

    Ответ: В. Сумма степеней была бы нечётной, хотя каждое ребро добавляет к ней два.

    Ошибки в других вариантах.

    А: Если семеро встанут в круг и каждый пожмёт руки обоим соседям, у всех будут одинаковые степени 2.

    Б: Если только одна пара пожмёт друг другу руки, число рукопожатий будет нечётным, а сумма степеней всё равно будет чётной.

    Г: Ограничение относится к каждой паре. Участник может пожать по одному разу руки нескольким людям.

    Д: Если семеро пожмут руки соседям по кругу, получится семь рёбер. Ещё одно рукопожатие между двумя людьми, которые стоят не рядом, даст восьмое ребро.
