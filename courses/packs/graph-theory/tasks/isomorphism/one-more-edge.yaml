question:
  text: |
    Какое из перечисленных рёбер можно добавить в левый граф, чтобы он стал изоморфен правому?
  html: |
    <p>Какое из перечисленных рёбер можно добавить в левый граф, чтобы он стал изоморфен правому?</p>
    <p><img src="images/one-more-edge.png" alt="Слева вершины A, B, C, D, E и F, рёбра AB, BC, CD, DE и EF. Справа вершины 1, 2, 3, 4, 5 и 6, рёбра 1–2, 2–3, 1–3, 3–4, 4–5 и 5–6."></p>
