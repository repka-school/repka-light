  hint:
    text: >-
      Посмотри, как должны измениться степени, и проверь, как в цепочке может появиться треугольник.
explanation:
  text: |
    Слева у двух концов цепочки степень 1, а у остальных вершин степень 2. Справа степень 1 у одной вершины, а степень 3 у другой. Значит, новое ребро соединяет конец цепочки с одной из её внутренних вершин.

    Справа вершины 1, 2 и 3 попарно соединены. Чтобы получить такой треугольник слева, новое ребро должно соединить вершины, между которыми в цепочке ровно два ребра.

    Ответ: Б. AC. Оно замыкает треугольник ABC и оставляет цепочку C–D–E–F.

    Проверка: если сопоставить A, B, C, D, E и F вершинам 1, 2, 3, 4, 5 и 6 по порядку, то шесть рёбер полученного графа переходят во все шесть рёбер правого.
note: >-
  Авторское задание и рисунок Repka по понятиям § 2.1. Без списка вариантов подойдут AC и DF. Условие ограничивает выбор, а среди вариантов есть только AC.
