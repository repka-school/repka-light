status: active
question:
  text: |
    У каждой вершины на обоих рисунках степень 2. Какое свойство показывает, что эти графы неизоморфны?
  html: |
    <p>У каждой вершины на обоих рисунках степень 2. Какое свойство показывает, что эти графы неизоморфны?</p>
    <p><img src="images/same-degrees.png" alt="Слева вершины A, B, C, D, E и F, рёбра AB, BC, CD, DE, EF и FA. Справа вершины K, L, M, N, P и R, рёбра KL, KM, LM, NP, NR и PR."></p>
  images:
    - file: images/same-degrees.png
answer:
  kind: single
  hide: false
  options:
    - id: 1
      text: >-
        Число вершин в графах различается.
    - id: 2
      text: >-
        Число рёбер в графах различается.
    - id: 3
      text: >-
        Левый граф связен, а правый распадается на две части.
      correct: true
    - id: 4
      text: >-
        У левого графа есть изолированная вершина.
    - id: 5
      text: >-
        В правом графе каждое ребро соединяет вершины одинаковой степени.
points: 2
difficulty: medium
classification:
  - subject: math
    concept: graphs
learning:
  theory:
    - graph-theory:isomorphism:same-structure
  hint:
    text: >-
      Посмотри, какие вершины можно посетить, двигаясь от одной вершины по рёбрам каждого графа.
explanation:
  text: |
    Слева по рёбрам шестиугольника от любой вершины можно дойти до любой другой.

    Справа из K по рёбрам можно дойти до L и M. Между этой тройкой и остальными вершинами рёбер нет.

    Изоморфизм сохраняет возможность добраться от одной вершины до другой, потому что каждый переход по ребру сохраняется.

    Ответ: В. Левый граф связен, а правый распадается на две части.

    Ошибки в других вариантах.

    А: В каждом графе шесть вершин.

    Б: Слева шесть рёбер по контуру, справа по три в каждом треугольнике.

    Г: У каждой вершины слева два соседа.

    Д: У всех вершин обоих графов степень 2, поэтому это свойство есть у обоих графов.
note: >-
  Авторское задание и рисунок Repka по понятиям § 2.1. Одинаковые степени всех вершин позволяют выделить связность как различающее свойство.
