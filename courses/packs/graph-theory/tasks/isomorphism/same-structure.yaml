question:
  text: |-
    Сравни два графа на рисунке. Можно ли заменить буквы числами так, чтобы все связи между вершинами сохранились?

    У вершин B и 2 по три соседа, поэтому поставь их в пару. Теперь сопоставь соседей степени 1. Пусть A соответствует 4, а C соответствует 5. Поставь в пару и оставшихся соседей, D и 1. Тогда E остаётся сопоставить с 3.

    При такой замене AB, BC, BD и DE переходят в 4–2, 2–5, 2–1 и 1–3. Это все рёбра правого графа, значит, замена сохраняет связи.

    Два графа равны, если у них совпадают множества вершин и множества рёбер.

    Например, если перенести точки на листе и оставить прежние имена вершин и связи между ними, получится другой рисунок того же графа.

    Графы изоморфны, если можно составить пары вершин, по одной вершине из каждого графа в паре. Каждая вершина должна входить ровно в одну пару. При таком соответствии рёбра переходят в рёбра, а пары вершин без ребра между ними — в такие же пары. Такое соответствие называют изоморфизмом.

    Например, графы на рисунке изоморфны, так как замена букв числами сохранила все связи. В одном графе вершины обозначены буквами, в другом — числами, поэтому множества вершин различаются.

    ✓ При изоморфизме степени соответствующих вершин совпадают, потому что соседи одной вершины переходят в соседей другой.

    ! Одинаковое число вершин и рёбер и одинаковый список степеней могут встречаться у графов разного строения.

    Граф связен, если от любой его вершины можно дойти по рёбрам до любой другой.

    Например, левый граф на рисунке связен, так как из каждой вершины можно дойти до B, а от B — до любой вершины.

    Если вершины графа можно разбить на две непустые группы без рёбер между ними, из одной группы в другую пройти нельзя.

    ✓ Изоморфизм сохраняет связность, потому что каждый переход по ребру сохраняется при замене имён.
  html: |-
    <p>Сравни два графа на рисунке. Можно ли заменить буквы числами так, чтобы все связи между вершинами сохранились?</p>
    <p><img src="images/same-structure.png" alt="Слева вершины A, B, C, D и E, рёбра AB, BC, BD и DE. Справа вершины 1, 2, 3, 4 и 5, рёбра 2–4, 2–5, 1–2 и 1–3."></p>
    <p>У вершин B и 2 по три соседа, поэтому поставь их в пару. Теперь сопоставь соседей степени 1. Пусть A соответствует 4, а C соответствует 5. Поставь в пару и оставшихся соседей, D и 1. Тогда E остаётся сопоставить с 3.</p>
    <p>При такой замене AB, BC, BD и DE переходят в 4–2, 2–5, 2–1 и 1–3. Это все рёбра правого графа, значит, замена сохраняет связи.</p>
    <blockquote><p>Два графа <strong>равны</strong>, если у них совпадают множества вершин и множества рёбер.</p></blockquote>
    <p>Например, если перенести точки на листе и оставить прежние имена вершин и связи между ними, получится другой рисунок того же графа.</p>
    <blockquote><p>Графы <strong>изоморфны</strong>, если можно составить пары вершин, по одной вершине из каждого графа в паре. Каждая вершина должна входить ровно в одну пару. При таком соответствии рёбра переходят в рёбра, а пары вершин без ребра между ними — в такие же пары. Такое соответствие называют <strong>изоморфизмом</strong>.</p></blockquote>
    <p>Например, графы на рисунке изоморфны, так как замена букв числами сохранила все связи. В одном графе вершины обозначены буквами, в другом — числами, поэтому множества вершин различаются.</p>
    <blockquote><p><strong>✓</strong> При изоморфизме степени соответствующих вершин совпадают, потому что соседи одной вершины переходят в соседей другой.</p></blockquote>
    <blockquote><p><strong>!</strong> Одинаковое число вершин и рёбер и одинаковый список степеней могут встречаться у графов разного строения.</p></blockquote>
    <blockquote><p>Граф <strong>связен</strong>, если от любой его вершины можно дойти по рёбрам до любой другой.</p></blockquote>
    <p>Например, левый граф на рисунке связен, так как из каждой вершины можно дойти до B, а от B — до любой вершины.</p>
    <p>Если вершины графа можно разбить на две непустые группы без рёбер между ними, из одной группы в другую пройти нельзя.</p>
    <blockquote><p><strong>✓</strong> Изоморфизм сохраняет связность, потому что каждый переход по ребру сохраняется при замене имён.</p></blockquote>
